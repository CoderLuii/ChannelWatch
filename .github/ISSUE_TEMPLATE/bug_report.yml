name: Bug Report
description: Something isn't working as expected
title: "[Bug]: "
labels: ["type/bug"]
assignees:
  - CoderLuii
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in as much detail as you can — it helps us reproduce and fix the issue faster.

        **Before opening:** check [Discussions](https://github.com/CoderLuii/ChannelWatch/discussions) and existing issues to see if this has already been reported.

        **This is a public issue.** Before posting, review every snippet and screenshot. Even sanitized debug bundles can contain DVR and client names, watched or recorded content, hostnames, IP addresses, and other network metadata. Remove identifying details as well as passwords, API keys, tokens, and webhook URLs. Never post backups or encryption keys.

        For diagnostic attachments, use **Diagnostics → Report a Problem**, review its public preview and attachments, and use the configured private support path. If unavailable, ask the maintainer for a private channel without attaching the data here. See the [privacy guide](https://github.com/CoderLuii/ChannelWatch/blob/main/docs/project/PRIVACY.md).

  - type: input
    id: cw_version
    attributes:
      label: ChannelWatch version
      description: In Settings > Updates, copy Application version. Include Container image version if the problem involves updating.
      placeholder: "e.g. 1.1.2"
    validations:
      required: true

  - type: input
    id: dvr_version
    attributes:
      label: Channels DVR version
      description: Shown in the Channels DVR web UI under Settings > About.
      placeholder: "e.g. 2024.06.15.1234"
    validations:
      required: true

  - type: input
    id: host_os
    attributes:
      label: Host OS / platform
      placeholder: "e.g. Ubuntu 22.04, Synology DSM 7.2, TrueNAS SCALE 24.04"
    validations:
      required: true

  - type: input
    id: docker_version
    attributes:
      label: Docker version
      placeholder: "e.g. 24.0.7"
    validations:
      required: false

  - type: dropdown
    id: num_dvrs
    attributes:
      label: Number of Channels DVR servers monitored
      options:
        - "1"
        - "2-4"
        - "5-9"
        - "10+"
    validations:
      required: true

  - type: textarea
    id: compose_snippet
    attributes:
      label: docker-compose.yml snippet
      description: Optionally paste only a minimal example you have reviewed and de-identified. Follow the privacy warning above.
      render: yaml
    validations:
      required: false

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps that reliably trigger the bug.
      placeholder: |
        1. Start ChannelWatch with the config above
        2. Navigate to ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Include only a short, relevant excerpt you have reviewed and de-identified.
        Do not attach a full debug bundle here; use the private support path described above.
      render: text
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Related issues or reviewed screenshots with names, content, addresses, and credentials removed.
    validations:
      required: false
