name: ChannelWatch - Release
run-name: "${{ github.event_name == 'push' && github.ref_name || format('PR #{0}', github.event.pull_request.number) }}"

# Required repository secrets:
# - CHANNELWATCH_UPDATE_SIGNING_KEY: Ed25519 private key used only for app-bundle signing.
# - DOCKERHUB_USERNAME: Docker Hub account name for image and description publishing.
# - DOCKERHUB_TOKEN: Docker Hub token with push and repository-description access.
# - GHCR_TOKEN: GitHub token with package write access for GHCR publishing.
# - SITE_SYNC_TOKEN: GitHub token limited to repository dispatches for ChannelWatch-site.

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches:
      - main

concurrency:
  group: channelwatch-release-publication-v2
  cancel-in-progress: false

permissions: {}

env:
  DOCKERHUB_IMAGE: coderluii/channelwatch
  GHCR_IMAGE: ghcr.io/coderluii/channelwatch
  DOCKER_PLATFORMS: linux/amd64,linux/arm64
  SKOPEO_IMAGE: quay.io/containers/skopeo:v1.22.3-immutable@sha256:f45eb1e14223a5ba0da4246274679a083653dab1402acc1fcb70a6339b50cf00 # v1.22.3
  RELEASE_TAG: ${{ github.ref_name }}
  RELEASE_SHA: ${{ github.sha }}

jobs:
  python:
    name: Python
    if: github.event_name == 'pull_request'
    runs-on: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.actor == 'CoderLuii' && vars.CHANNELWATCH_RELEASE_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: python -m pip install -c deploy/requirements/dev.constraints.txt -r deploy/requirements/runtime.txt -r deploy/requirements/dev.txt
      - name: Compile Python
        run: python -m compileall app/core app/ui/backend
      - name: Run backend suite
        env:
          PYTHONPATH: app
        run: python -m pytest app/core/tests

  frontend:
    name: Frontend
    if: github.event_name == 'pull_request'
    runs-on: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.actor == 'CoderLuii' && vars.CHANNELWATCH_RELEASE_RUNNER || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: app/ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Enable pinned pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  browser:
    name: Browser
    if: github.event_name == 'pull_request'
    runs-on: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.actor == 'CoderLuii' && vars.CHANNELWATCH_RELEASE_RUNNER || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: app/ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm build
      - name: Run browser, responsive, visual, keyboard, and accessibility checks
        run: pnpm exec playwright test
      - name: Retain browser diagnostics, including first failed attempts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-browser-${{ github.sha }}
          path: |
            app/ui/playwright-report/
            app/ui/test-results/
          retention-days: 7
          if-no-files-found: warn

  docs-config:
    name: Docs and config
    runs-on: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.actor == 'CoderLuii' && vars.CHANNELWATCH_RELEASE_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: bash deploy/scripts/doc-qa/diataxis-check.sh
      - run: bash deploy/scripts/doc-qa/spell-check.sh
      - name: Validate Compose examples
        run: |
          for compose_file in deploy/compose/*.yml; do
            docker compose -f "${compose_file}" config --quiet
          done

  helm:
    name: Helm
    runs-on: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.actor == 'CoderLuii' && vars.CHANNELWATCH_RELEASE_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Lint and render managed-local mode
        run: |
          helm lint deploy/helm/channelwatch
          helm template channelwatch deploy/helm/channelwatch >/dev/null
      - name: Render optional legacy migration Secret
        run: helm template channelwatch deploy/helm/channelwatch --set-string secretConfig.secretStorageKey=ci-only-0123456789abcdef0123456789abcdef >/dev/null
      - name: Render existing Secret mode
        run: helm template channelwatch deploy/helm/channelwatch --set-string secretConfig.existingSecret=channelwatch-runtime >/dev/null
      - name: Verify invalid values fail
        run: |
          if helm template channelwatch deploy/helm/channelwatch --set-string secretConfig.secretStorageKey=short >/dev/null 2>&1; then exit 1; fi
          if helm template channelwatch deploy/helm/channelwatch --set-string secretConfig.existingSecret=external --set-string secretConfig.secretStorageKey=ci-only-0123456789abcdef0123456789abcdef >/dev/null 2>&1; then exit 1; fi
          if helm template channelwatch deploy/helm/channelwatch --set replicaCount=2 >/dev/null 2>&1; then exit 1; fi
          if helm template channelwatch deploy/helm/channelwatch --set persistence.enabled=false >/dev/null 2>&1; then exit 1; fi

  container:
    name: Container build
    if: github.event_name == 'pull_request'
    runs-on: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.actor == 'CoderLuii' && vars.CHANNELWATCH_RELEASE_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64
          push: false

  security:
    name: Security
    runs-on: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.actor == 'CoderLuii' && vars.CHANNELWATCH_RELEASE_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.75.0
          cache: false

      - name: Scan filesystem, including the rendered Helm chart
        env:
          CHANNELWATCH_TRIVY_REPORT: ${{ runner.temp }}/channelwatch-trivy.json
        run: |
          trivy fs \
            --scanners secret,misconfig \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --exit-code 1 \
            --ignorefile .trivyignore.yaml \
            --skip-files deploy/docker/Dockerfile.dockerignore \
            --format json \
            --output "${CHANNELWATCH_TRIVY_REPORT}" \
            .
      - name: Report accepted upstream dependency vulnerabilities
        run: |
          trivy fs \
            --scanners vuln \
            --include-dev-deps \
            --severity CRITICAL,HIGH,MEDIUM,LOW \
            --exit-code 0 \
            --format json \
            --output "${RUNNER_TEMP}/channelwatch-upstream-dependencies.json" \
            .
          echo "Upstream dependency vulnerabilities are advisory; code, secret and configuration checks remain enforced."
      - name: Retain upstream dependency report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upstream-dependencies-${{ github.sha }}
          path: ${{ runner.temp }}/channelwatch-upstream-dependencies.json
          retention-days: 30
          if-no-files-found: error
      - name: Scan the explicit Helm Secret mode
        env:
          CHANNELWATCH_TRIVY_SECRET_REPORT: ${{ runner.temp }}/channelwatch-trivy-secret.json
        run: |
          trivy config \
            --severity CRITICAL,HIGH \
            --exit-code 1 \
            --ignorefile .trivyignore.yaml \
            --helm-set-string secretConfig.apiKey=ci-only-placeholder-not-a-real-secret \
            --format json \
            --output "${CHANNELWATCH_TRIVY_SECRET_REPORT}" \
            deploy/helm/channelwatch
      - name: Prove Trivy scanned both Helm Secret modes
        env:
          CHANNELWATCH_TRIVY_REPORT: ${{ runner.temp }}/channelwatch-trivy.json
          CHANNELWATCH_TRIVY_SECRET_REPORT: ${{ runner.temp }}/channelwatch-trivy-secret.json
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          default_report = json.loads(
              Path(os.environ["CHANNELWATCH_TRIVY_REPORT"]).read_text(encoding="utf-8")
          )
          secret_report = json.loads(
              Path(os.environ["CHANNELWATCH_TRIVY_SECRET_REPORT"]).read_text(
                  encoding="utf-8"
              )
          )
          default_targets = {
              str(result.get("Target") or "")
              for result in default_report.get("Results", [])
              if result.get("Type") == "helm"
          }
          default_required = {
              "deploy/helm/channelwatch/templates/configmap.yaml",
              "deploy/helm/channelwatch/templates/deployment.yaml",
          }
          default_missing = sorted(default_required - default_targets)
          default_secret = "deploy/helm/channelwatch/templates/secret.yaml"
          if default_missing:
              raise SystemExit(
                  "Trivy did not scan required managed-local Helm targets: "
                  + ", ".join(default_missing)
              )
          if default_secret in default_targets:
              raise SystemExit(
                  "The managed-local Helm render unexpectedly contains a Secret."
              )

          secret_targets = {
              str(result.get("Target") or "")
              for result in secret_report.get("Results", [])
              if result.get("Type") == "helm"
          }
          secret_required = {
              "templates/deployment.yaml",
              "templates/secret.yaml",
          }
          secret_missing = sorted(secret_required - secret_targets)
          if secret_missing:
              raise SystemExit(
                  "Trivy did not scan required explicit-Secret Helm targets: "
                  + ", ".join(secret_missing)
              )
          print(
              "Trivy scanned managed-local and explicit-Secret Helm modes "
              f"({len(default_targets)} + {len(secret_targets)} resources)."
          )
          PY
  runtime-dependencies:
    name: Build native ${{ matrix.architecture }} runtime dependencies
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
            machine: x86_64
            wheel_platform: manylinux_2_36_x86_64
          - architecture: arm64
            runner: ubuntu-24.04-arm
            machine: aarch64
            wheel_platform: manylinux_2_36_aarch64

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Build and execute deterministic native dependency closure twice
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          EXPECTED_MACHINE: ${{ matrix.machine }}
          RUNTIME_BUILDER_DIGEST: sha256:48b13b003dda20b16f9442b8475aa05fe21bf6579a8c881db92ffb4d8fd20f83
          RUNTIME_BUILDER_IMAGE: python:3.14-slim-bookworm@sha256:48b13b003dda20b16f9442b8475aa05fe21bf6579a8c881db92ffb4d8fd20f83
          WHEEL_PLATFORM: ${{ matrix.wheel_platform }}
        shell: bash
        run: |
          set -euo pipefail
          docker pull "${RUNTIME_BUILDER_IMAGE}"
          image_digest="$(docker image inspect --format '{{join .RepoDigests "\n"}}' \
            "${RUNTIME_BUILDER_IMAGE}" | grep -Fx "python@${RUNTIME_BUILDER_DIGEST}")"
          if [ "${image_digest}" != "python@${RUNTIME_BUILDER_DIGEST}" ]; then
            echo "::error::Runtime builder image does not match its immutable digest."
            exit 1
          fi
          image_architecture="$(docker image inspect --format '{{.Architecture}}' \
            "${RUNTIME_BUILDER_IMAGE}")"
          if [ "${image_architecture}" != "${ARCHITECTURE}" ]; then
            echo "::error::Runtime dependency build is not running on native ${ARCHITECTURE}."
            exit 1
          fi

          docker run --rm --pull=never \
            --env ARCHITECTURE \
            --env EXPECTED_MACHINE \
            --env RUNTIME_BUILDER_DIGEST \
            --env WHEEL_PLATFORM \
            --volume "${GITHUB_WORKSPACE}:/src:ro" \
            --volume "${RUNNER_TEMP}:/work" \
            --workdir /src \
            "${RUNTIME_BUILDER_IMAGE}" \
            /bin/sh -euxc '
              [ "$(uname -m)" = "${EXPECTED_MACHINE}" ]
              python - <<"PY" > /work/compatible-wheel-tags.txt
          from pip._vendor.packaging.tags import sys_tags
          print("\n".join(sorted({str(tag) for tag in sys_tags()})))
          PY
              for build in one two; do
                set --
                while IFS= read -r tag; do
                  set -- "$@" --compatible-wheel-tag "${tag}"
                done < /work/compatible-wheel-tags.txt
                python scripts/release/build-runtime-dependencies.py \
                  --requirements deploy/requirements/runtime-update.txt \
                  --lock deploy/requirements/runtime-update.lock \
                  --wheelhouse "/work/wheelhouse-${build}" \
                  --output "/work/runtime-${ARCHITECTURE}-${build}" \
                  --architecture "${ARCHITECTURE}" \
                  --python-cache-tag cpython-314 \
                  --python-version 3.14.8 \
                  --libc-family glibc \
                  --minimum-libc-version 2.36 \
                  --wheel-platform "${WHEEL_PLATFORM}" \
                  --builder-image-digest "${RUNTIME_BUILDER_DIGEST}" \
                  "$@"
              done
              diff -ru "/work/runtime-${ARCHITECTURE}-one" \
                "/work/runtime-${ARCHITECTURE}-two"
              python -I -B - "/work/runtime-${ARCHITECTURE}-one/dependencies/site-packages" \
                "${EXPECTED_MACHINE}" <<"PY"
          import platform
          import sys
          sys.path.insert(0, sys.argv[1])
          import bcrypt
          import cryptography
          import httptools
          import pydantic_core
          import sqlalchemy
          import uvloop
          import yaml
          assert platform.machine() == sys.argv[2]
          assert all((bcrypt, cryptography, httptools, pydantic_core, sqlalchemy, uvloop, yaml))
          PY
              tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner \
                -C "/work/runtime-${ARCHITECTURE}-one" \
                -cf "/work/channelwatch-runtime-dependencies-${ARCHITECTURE}.tar" .
              cd /work
              sha256sum "channelwatch-runtime-dependencies-${ARCHITECTURE}.tar" \
                > "channelwatch-runtime-dependencies-${ARCHITECTURE}.tar.sha256"
            '

      - name: Retain native dependency closure
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-dependencies-${{ matrix.architecture }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/channelwatch-runtime-dependencies-${{ matrix.architecture }}.tar
            ${{ runner.temp }}/channelwatch-runtime-dependencies-${{ matrix.architecture }}.tar.sha256
          retention-days: 7
          if-no-files-found: error

  candidate-source-gates:
    name: Verify release source and static frontend without secrets
    needs: runtime-dependencies
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      runtime_generation_required: ${{ steps.release_config.outputs.runtime_generation_required }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Read release capability requirements
        id: release_config
        shell: bash
        run: |
          required="$(jq -r '.runtime_generation_required // false' scripts/release/release-config.json)"
          if [ "${required}" != "true" ] && [ "${required}" != "false" ]; then
            echo "::error::runtime_generation_required must be boolean."
            exit 1
          fi
          echo "runtime_generation_required=${required}" >> "${GITHUB_OUTPUT}"
      - name: Set up pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Set up pinned Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install constrained Python dependencies
        run: |
          python -m pip install --upgrade \
            -c deploy/requirements/dev.constraints.txt \
            -r deploy/requirements/runtime.txt \
            -r deploy/requirements/dev.txt
      - name: Run source gates
        run: |
          python scripts/release/release_version_policy.py
          python -m compileall app/core app/ui/backend
          PYTHONPATH=app python -m pytest app/core/tests
      - name: Build verified static frontend
        working-directory: app/ui
        env:
          CHANNELWATCH_BUILD_ID: ${{ github.sha }}
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm lint
          pnpm test
          pnpm build
          pnpm exec playwright install --with-deps chromium firefox webkit
          pnpm exec playwright test
      - name: Retain verified static frontend
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-static-${{ github.sha }}
          path: app/ui/out/
          retention-days: 7
          if-no-files-found: error
      - name: Download native runtime dependency closures
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: runtime-dependencies-*-${{ github.sha }}
          path: ${{ runner.temp }}/runtime-dependencies
          merge-multiple: true
      - name: Build deterministic unsigned runtime archives
        shell: bash
        run: |
          set -euo pipefail
          version="$(jq -r '.version' scripts/release/release-config.json)"
          if [ "$(jq -r '.runtime_generation_required // false' scripts/release/release-config.json)" != "true" ]; then
            mkdir -p dist/unsigned-runtime
            printf '{"status":"not_required"}\n' > dist/unsigned-runtime/runtime-not-required.json
            exit 0
          fi
          source_date_epoch="$(git show -s --format=%ct "${GITHUB_SHA}")"
          runtime_app_root="${RUNNER_TEMP}/channelwatch-runtime-application"
          python -I - "${runtime_app_root}" "${version}" <<'PY'
          import importlib.util
          import sys
          from pathlib import Path
          script = Path("scripts/release/build-update-bundle.py").resolve()
          spec = importlib.util.spec_from_file_location("channelwatch_update_bundle", script)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          module.stage_runtime_application_payload(Path(sys.argv[1]), version=sys.argv[2])
          PY
          for architecture in amd64 arm64; do
            archive="channelwatch-runtime-dependencies-${architecture}.tar"
            (cd "${RUNNER_TEMP}/runtime-dependencies" && sha256sum --check "${archive}.sha256")
            dependency_root="${RUNNER_TEMP}/runtime-${architecture}"
            mkdir -p "${dependency_root}"
            tar -xf "${RUNNER_TEMP}/runtime-dependencies/${archive}" -C "${dependency_root}"
            for candidate in candidate-one candidate-two; do
              mkdir -p "dist/unsigned-runtime/${candidate}"
              python scripts/release/build-runtime-bundle.py \
                --app-root "${runtime_app_root}" \
                --dependency-root "${dependency_root}" \
                --output "dist/unsigned-runtime/${candidate}/channelwatch-runtime-v${version}-${architecture}.zip" \
                --application-version "${version}" --source-commit "${GITHUB_SHA}" \
                --settings-schema-version 7 --source-date-epoch "${source_date_epoch}"
            done
          done
          diff -u \
            <(cd dist/unsigned-runtime/candidate-one && sha256sum ./*) \
            <(cd dist/unsigned-runtime/candidate-two && sha256sum ./*)
      - name: Retain deterministic unsigned runtime archives
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-runtime-bundles-${{ github.sha }}
          path: dist/unsigned-runtime/
          retention-days: 7
          if-no-files-found: error
      - name: Retain browser diagnostics, including first failed attempts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-browser-${{ github.sha }}
          path: |
            app/ui/playwright-report/
            app/ui/test-results/
          retention-days: 7
          if-no-files-found: warn

  candidate-signing:
    name: Sign and seal candidate assets on a fresh runner
    needs: [candidate-source-gates, runtime-dependencies]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout exact audited signer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Download verified static frontend
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-static-${{ github.sha }}
          path: app/ui/out
      - name: Download native runtime dependency closures
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: runtime-dependencies-amd64-${{ github.sha }}
          path: ${{ runner.temp }}/runtime-dependencies
      - name: Download deterministic unsigned runtime archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unsigned-runtime-bundles-${{ github.sha }}
          path: ${{ runner.temp }}/unsigned-runtime
      - name: Sign, verify, and seal immutable candidate inputs
        env:
          CHANNELWATCH_UPDATE_SIGNING_KEY: ${{ secrets.CHANNELWATCH_UPDATE_SIGNING_KEY }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          signing_key="${CHANNELWATCH_UPDATE_SIGNING_KEY}"
          test -n "${signing_key}"
          unset CHANNELWATCH_UPDATE_SIGNING_KEY
          mkdir -p dist/runtime-dependencies/amd64 dist/candidate-initial
          (cd "${RUNNER_TEMP}/runtime-dependencies" && sha256sum --check channelwatch-runtime-dependencies-amd64.tar.sha256)
          tar -xf "${RUNNER_TEMP}/runtime-dependencies/channelwatch-runtime-dependencies-amd64.tar" \
            -C dist/runtime-dependencies/amd64
          export PYTHONPATH="${GITHUB_WORKSPACE}/dist/runtime-dependencies/amd64/dependencies/site-packages"
          version="$(jq -r '.version' scripts/release/release-config.json)"
          tag="v${version}"
          delivery_mode="$(jq -r '.delivery_mode' scripts/release/release-config.json)"
          runtime_generation_required="$(jq -r '.runtime_generation_required // false' scripts/release/release-config.json)"
          common_args=(
            --version "${version}"
            --bundle-url "https://github.com/CoderLuii/ChannelWatch/releases/download/${tag}/channelwatch-app-${tag}.zip"
            --release-url "https://github.com/CoderLuii/ChannelWatch/releases/tag/${tag}"
            --delivery-mode "${delivery_mode}"
            --minimum-image-version "$(jq -r '.minimum_image_version' scripts/release/release-config.json)"
            --updater-protocol "$(jq -r '.updater_protocol' scripts/release/release-config.json)"
            --recommended-image-version "$(jq -r '.recommended_image_version' scripts/release/release-config.json)"
            --publication-time "$(jq -r '.publication_time' scripts/release/release-config.json)"
            --automatic-install-after "$(jq -r '.automatic_install_after' scripts/release/release-config.json)"
          )
          runtime_url_args=()
          runtime_one_args=()
          runtime_two_args=()
          if [ "${runtime_generation_required}" = "true" ]; then
            cp -R "${RUNNER_TEMP}/unsigned-runtime/candidate-one" dist/candidate-one
            cp -R "${RUNNER_TEMP}/unsigned-runtime/candidate-two" dist/candidate-two
            for architecture in amd64 arm64; do
              runtime_url_args+=(--runtime-bundle-url "${architecture}=https://github.com/CoderLuii/ChannelWatch/releases/download/${tag}/channelwatch-runtime-${tag}-${architecture}.zip")
            done
            runtime_one_args=(--runtime-bundle "amd64=dist/candidate-one/channelwatch-runtime-${tag}-amd64.zip" --runtime-bundle "arm64=dist/candidate-one/channelwatch-runtime-${tag}-arm64.zip")
            runtime_two_args=(--runtime-bundle "amd64=dist/candidate-two/channelwatch-runtime-${tag}-amd64.zip" --runtime-bundle "arm64=dist/candidate-two/channelwatch-runtime-${tag}-arm64.zip")
          fi
          CHANNELWATCH_UPDATE_SIGNING_KEY="${signing_key}" python scripts/release/build-update-bundle.py "${common_args[@]}" "${runtime_url_args[@]}" "${runtime_one_args[@]}" --out-dir dist/candidate-one
          CHANNELWATCH_UPDATE_SIGNING_KEY="${signing_key}" python scripts/release/build-update-bundle.py "${common_args[@]}" "${runtime_url_args[@]}" "${runtime_two_args[@]}" --out-dir dist/candidate-two
          diff -u <(cd dist/candidate-one && sha256sum ./*) <(cd dist/candidate-two && sha256sum ./*)
          config_sha256="$(sha256sum scripts/release/release-config.json | awk '{print $1}')"
          jq -cS -j -n --arg repository "${GITHUB_REPOSITORY}" --arg run_id "${GITHUB_RUN_ID}" \
            --arg run_attempt "${GITHUB_RUN_ATTEMPT}" --arg source_sha "${GITHUB_SHA}" \
            --arg release_tag "${GITHUB_REF_NAME}" --arg release_config_sha256 "${config_sha256}" \
            '{schema:1,repository:$repository,run_id:$run_id,run_attempt:$run_attempt,source_sha:$source_sha,release_tag:$release_tag,release_config_sha256:$release_config_sha256}' \
            > dist/candidate-initial/transport-context.json
          CHANNELWATCH_UPDATE_SIGNING_KEY="${signing_key}" python scripts/release/candidate-transport.py generate-keypair \
            --context dist/candidate-initial/transport-context.json \
            --public-key-out dist/candidate-initial/transport-public.json \
            --sealed-private-key-out dist/candidate-initial/transport-private.sealed
          tar --sort=name --owner=0 --group=0 --numeric-owner --format=posix \
            -cf "${RUNNER_TEMP}/signed-assets.tar" -C dist candidate-one candidate-two
          CHANNELWATCH_UPDATE_SIGNING_KEY="${signing_key}" python scripts/release/seal-candidate-artifact.py seal \
            --input "${RUNNER_TEMP}/signed-assets.tar" \
            --output dist/candidate-initial/signed-assets.sealed
      - name: Retain sealed initial signer output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-signer-${{ github.sha }}
          path: dist/candidate-initial/
          retention-days: 7
          if-no-files-found: error

  runtime-capability:
    name: Prove protocol-4 runtime lifecycle (${{ matrix.architecture }})
    needs: [candidate-source-gates, candidate-signing, runtime-dependencies]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout exact native verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Download sealed signed runtime assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: candidate-signer-${{ github.sha }}
          path: ${{ runner.temp }}/candidate-signer
      - name: Download the native verified dependency closure
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: runtime-dependencies-${{ matrix.architecture }}-${{ github.sha }}
          path: ${{ runner.temp }}/runtime-dependencies
      - name: Set up Node for headless live Update Center verification
        if: needs.candidate-source-gates.outputs.runtime_generation_required == 'true' && matrix.architecture == 'amd64'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Install the existing headless Chromium harness
        if: needs.candidate-source-gates.outputs.runtime_generation_required == 'true' && matrix.architecture == 'amd64'
        working-directory: app/ui
        env:
          CI: 'true'
          BROWSER: none
          PLAYWRIGHT_HTML_OPEN: never
        run: |
          corepack enable
          test "$(pnpm --version)" = "11.28.5"
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Open signed assets before native qualification starts
        if: needs.candidate-source-gates.outputs.runtime_generation_required == 'true'
        env:
          CHANNELWATCH_UPDATE_SIGNING_KEY: ${{ secrets.CHANNELWATCH_UPDATE_SIGNING_KEY }}
          NATIVE_ARCHITECTURE: ${{ matrix.architecture }}
        shell: bash
        run: |
          set -euo pipefail
          signing_key="${CHANNELWATCH_UPDATE_SIGNING_KEY}"
          test -n "${signing_key}"
          unset CHANNELWATCH_UPDATE_SIGNING_KEY
          dependency_archive="channelwatch-runtime-dependencies-${NATIVE_ARCHITECTURE}.tar"
          (cd "${RUNNER_TEMP}/runtime-dependencies" && sha256sum --check "${dependency_archive}.sha256")
          dependency_root="${RUNNER_TEMP}/native-dependencies"
          mkdir -p "${dependency_root}" "${RUNNER_TEMP}/signed-assets"
          tar -xf "${RUNNER_TEMP}/runtime-dependencies/${dependency_archive}" -C "${dependency_root}"
          export PYTHONPATH="${dependency_root}/dependencies/site-packages"
          CHANNELWATCH_UPDATE_SIGNING_KEY="${signing_key}" python scripts/release/seal-candidate-artifact.py open \
            --input "${RUNNER_TEMP}/candidate-signer/signed-assets.sealed" \
            --output "${RUNNER_TEMP}/signed-assets.tar"
          tar -xf "${RUNNER_TEMP}/signed-assets.tar" -C "${RUNNER_TEMP}/signed-assets"
          rm -f "${RUNNER_TEMP}/signed-assets.tar"
          echo "PYTHONPATH=${PYTHONPATH}" >> "${GITHUB_ENV}"
      - name: Run the native protocol-4 lifecycle verifier
        if: needs.candidate-source-gates.outputs.runtime_generation_required == 'true'
        env:
          NATIVE_ARCHITECTURE: ${{ matrix.architecture }}
          CI: 'true'
          BROWSER: none
          PLAYWRIGHT_HTML_OPEN: never
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/runtime-capability"
          version="$(jq -r '.version' scripts/release/release-config.json)"
          updater_protocol="$(jq -r '.updater_protocol' scripts/release/release-config.json)"
          runtime_generation_required="$(jq -r '.runtime_generation_required // false' scripts/release/release-config.json)"
          if [ "${updater_protocol}" != "4" ] || [ "${runtime_generation_required}" != "true" ]; then
            echo "::error::Native runtime qualification was scheduled for a release without a full protocol-4 generation."
            exit 1
          fi
          tag="v${version}"
          python scripts/release/verify-runtime-capability.py \
            --catalog "${RUNNER_TEMP}/signed-assets/candidate-one/channelwatch-update-catalog-v3.json" \
            --amd64-bundle "${RUNNER_TEMP}/signed-assets/candidate-one/channelwatch-runtime-${tag}-amd64.zip" \
            --arm64-bundle "${RUNNER_TEMP}/signed-assets/candidate-one/channelwatch-runtime-${tag}-arm64.zip" \
            --version "${version}" \
            --source-commit "${GITHUB_SHA}" \
            --minimum-image-version "$(jq -r '.minimum_image_version' scripts/release/release-config.json)" \
            --image-index-digest "$(jq -r '.minimum_image_sha256' scripts/release/release-config.json)" \
            --architecture "${NATIVE_ARCHITECTURE}" \
            --evidence-json "${RUNNER_TEMP}/runtime-capability/runtime-capability-${NATIVE_ARCHITECTURE}.json"
      - name: Validate the complete native receipt before retention
        if: needs.candidate-source-gates.outputs.runtime_generation_required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/release/aggregate-runtime-capability.py \
            --validate-evidence "${RUNNER_TEMP}/runtime-capability/runtime-capability-${{ matrix.architecture }}.json" \
            --architecture "${{ matrix.architecture }}" \
            --catalog "${RUNNER_TEMP}/signed-assets/candidate-one/channelwatch-update-catalog-v3.json" \
            --release-config scripts/release/release-config.json \
            --source-commit "${GITHUB_SHA}"
      - name: Retain native runtime capability evidence
        if: needs.candidate-source-gates.outputs.runtime_generation_required == 'true' && always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-capability-${{ matrix.architecture }}-${{ github.sha }}
          path: ${{ runner.temp }}/runtime-capability/
          retention-days: 7
          if-no-files-found: error

  legacy-app-upgrade:
    name: Prove legacy in-app upgrade (${{ matrix.architecture }})
    needs: [candidate-source-gates, candidate-signing, runtime-dependencies]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout exact legacy verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Set up Node for isolated headless browser checks
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Install the existing headless Chromium harness
        working-directory: app/ui
        env:
          CI: 'true'
          BROWSER: none
          PLAYWRIGHT_HTML_OPEN: never
        run: |
          corepack enable
          test "$(pnpm --version)" = "11.28.5"
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Download sealed signed app assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: candidate-signer-${{ github.sha }}
          path: ${{ runner.temp }}/candidate-signer
      - name: Download the native verified dependency closure
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: runtime-dependencies-${{ matrix.architecture }}-${{ github.sha }}
          path: ${{ runner.temp }}/runtime-dependencies
      - name: Open signed app assets before native qualification
        env:
          CHANNELWATCH_UPDATE_SIGNING_KEY: ${{ secrets.CHANNELWATCH_UPDATE_SIGNING_KEY }}
          NATIVE_ARCHITECTURE: ${{ matrix.architecture }}
        shell: bash
        run: |
          set -euo pipefail
          signing_key="${CHANNELWATCH_UPDATE_SIGNING_KEY}"
          test -n "${signing_key}"
          unset CHANNELWATCH_UPDATE_SIGNING_KEY
          archive="channelwatch-runtime-dependencies-${NATIVE_ARCHITECTURE}.tar"
          (cd "${RUNNER_TEMP}/runtime-dependencies" && sha256sum --check "${archive}.sha256")
          mkdir -p "${RUNNER_TEMP}/native-dependencies" "${RUNNER_TEMP}/signed-assets"
          tar -xf "${RUNNER_TEMP}/runtime-dependencies/${archive}" -C "${RUNNER_TEMP}/native-dependencies"
          export PYTHONPATH="${RUNNER_TEMP}/native-dependencies/dependencies/site-packages"
          CHANNELWATCH_UPDATE_SIGNING_KEY="${signing_key}" python scripts/release/seal-candidate-artifact.py open \
            --input "${RUNNER_TEMP}/candidate-signer/signed-assets.sealed" \
            --output "${RUNNER_TEMP}/signed-assets.tar"
          tar -xf "${RUNNER_TEMP}/signed-assets.tar" -C "${RUNNER_TEMP}/signed-assets"
          rm -f "${RUNNER_TEMP}/signed-assets.tar"
          echo "PYTHONPATH=${PYTHONPATH}" >> "${GITHUB_ENV}"
      - name: Download and bind published legacy overlay assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/legacy-overlays"
          for version in 1.4.1 1.4.5; do
            curl --fail --location --silent --show-error \
              --output "${RUNNER_TEMP}/legacy-overlays/channelwatch-catalog-v${version}.json" \
              "https://github.com/CoderLuii/ChannelWatch/releases/download/v${version}/channelwatch-catalog-v${version}.json"
            curl --fail --location --silent --show-error \
              --output "${RUNNER_TEMP}/legacy-overlays/channelwatch-app-v${version}.zip" \
              "https://github.com/CoderLuii/ChannelWatch/releases/download/v${version}/channelwatch-app-v${version}.zip"
          done
          echo "bb0b636ed70b139b67b7b824d4542a5a80798be9db71a30b6a10bf8e5a2539df  ${RUNNER_TEMP}/legacy-overlays/channelwatch-catalog-v1.4.1.json" | sha256sum --check
          echo "89c4cd4f0d0aebff5224e84c5a51a28c514067cd66486ca26cbde3f17e96c8cd  ${RUNNER_TEMP}/legacy-overlays/channelwatch-app-v1.4.1.zip" | sha256sum --check
          echo "376e7f0572a7f3ebcc2ce74f1d30a703c026a690c99fca81108d08f5db31f783  ${RUNNER_TEMP}/legacy-overlays/channelwatch-catalog-v1.4.5.json" | sha256sum --check
          echo "d354ea7d424e4a7c8af623fad2408665f8e536b7ec171979da8bed4afed9f362  ${RUNNER_TEMP}/legacy-overlays/channelwatch-app-v1.4.5.zip" | sha256sum --check
      - name: Run the native legacy same-container matrix
        env:
          NATIVE_ARCHITECTURE: ${{ matrix.architecture }}
          CI: 'true'
          BROWSER: none
          PLAYWRIGHT_HTML_OPEN: never
        shell: bash
        run: |
          set -euo pipefail
          version="$(jq -r '.version' scripts/release/release-config.json)"
          test "$(jq -c '.legacy_app_update_sources' scripts/release/release-config.json)" = '["1.4.0","1.4.1","1.4.5"]'
          tag="v${version}"
          evidence="${RUNNER_TEMP}/legacy-app-upgrades"
          mkdir -p "${evidence}"
          scenarios=(
            stock-1.4.0
            overlay-1.4.0-to-1.4.1
            overlay-1.4.0-to-1.4.5
            stock-1.4.1
            overlay-1.4.1-to-1.4.5
            stock-1.4.5
          )
          for scenario in "${scenarios[@]}"; do
            overlay_version=""
            case "${scenario}" in
              *to-1.4.1) overlay_version="1.4.1" ;;
              *to-1.4.5) overlay_version="1.4.5" ;;
            esac
            overlay_args=()
            if [ -n "${overlay_version}" ]; then
              overlay_args=(
                --overlay-catalog "${RUNNER_TEMP}/legacy-overlays/channelwatch-catalog-v${overlay_version}.json"
                --overlay-bundle "${RUNNER_TEMP}/legacy-overlays/channelwatch-app-v${overlay_version}.zip"
              )
            fi
            python scripts/release/verify-legacy-app-upgrade.py \
              --baselines scripts/release/legacy-app-upgrade-baselines.json \
              --release-config scripts/release/release-config.json \
              --scenario "${scenario}" \
              --architecture "${NATIVE_ARCHITECTURE}" \
              --target-version "${version}" \
              --source-commit "${GITHUB_SHA}" \
              --catalog "${RUNNER_TEMP}/signed-assets/candidate-one/channelwatch-catalog-${tag}.json" \
              --bundle "${RUNNER_TEMP}/signed-assets/candidate-one/channelwatch-app-${tag}.zip" \
              "${overlay_args[@]}" \
              --receipt "${evidence}/legacy-app-upgrade-${NATIVE_ARCHITECTURE}-${scenario}.json" \
              --log-directory "${evidence}/legacy-app-upgrade-${NATIVE_ARCHITECTURE}-${scenario}-logs"
          done
      - name: Retain native legacy app-upgrade evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: legacy-app-upgrade-${{ matrix.architecture }}-${{ github.sha }}
          path: ${{ runner.temp }}/legacy-app-upgrades/
          retention-days: 7
          if-no-files-found: error

  candidate-qualification:
    needs: [docs-config, helm, security, runtime-dependencies, candidate-source-gates, candidate-signing, runtime-capability, legacy-app-upgrade]
    name: Build and verify private signed candidate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.candidate_upload.outputs.artifact-id }}

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Python for the audited opener
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Download sealed initial signer output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: candidate-signer-${{ github.sha }}
          path: ${{ runner.temp }}/candidate-signer

      - name: Download native runtime capability evidence
        if: needs.candidate-source-gates.outputs.runtime_generation_required == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: runtime-capability-*-${{ github.sha }}
          path: ${{ runner.temp }}/runtime-capability
          merge-multiple: true

      - name: Download native legacy app-upgrade evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: legacy-app-upgrade-*-${{ github.sha }}
          path: ${{ runner.temp }}/legacy-app-upgrades
          merge-multiple: true

      - name: Download native runtime dependency closures
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: runtime-dependencies-*-${{ github.sha }}
          path: ${{ runner.temp }}/runtime-dependencies
          merge-multiple: true

      - name: Open signed assets before qualification starts
        env:
          CHANNELWATCH_UPDATE_SIGNING_KEY: ${{ secrets.CHANNELWATCH_UPDATE_SIGNING_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          signing_key="${CHANNELWATCH_UPDATE_SIGNING_KEY}"
          test -n "${signing_key}"
          unset CHANNELWATCH_UPDATE_SIGNING_KEY
          mkdir -p "${RUNNER_TEMP}/opener-dependencies"
          (cd "${RUNNER_TEMP}/runtime-dependencies" && sha256sum --check channelwatch-runtime-dependencies-amd64.tar.sha256)
          tar -xf "${RUNNER_TEMP}/runtime-dependencies/channelwatch-runtime-dependencies-amd64.tar" \
            -C "${RUNNER_TEMP}/opener-dependencies"
          export PYTHONPATH="${RUNNER_TEMP}/opener-dependencies/dependencies/site-packages"
          CHANNELWATCH_UPDATE_SIGNING_KEY="${signing_key}" python scripts/release/seal-candidate-artifact.py open \
            --input "${RUNNER_TEMP}/candidate-signer/signed-assets.sealed" \
            --output "${RUNNER_TEMP}/signed-assets.tar"
          mkdir -p dist
          tar -xf "${RUNNER_TEMP}/signed-assets.tar" -C dist
          rm -f "${RUNNER_TEMP}/signed-assets.tar"

      - name: Verify exact candidate identity
        env:
          EXPECTED_TAG: ${{ github.ref_name }}
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          actual_version="$(jq -r '.version' scripts/release/release-config.json)"
          actual_tag="v${actual_version}"
          actual_subject="$(git log -1 --format=%s)"
          actual_body="$(git log -1 --format=%b)"
          if [[ ! "${EXPECTED_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The pushed candidate must resolve to a complete commit SHA."
            exit 1
          fi
          if [ "${EXPECTED_TAG}" != "${actual_tag}" ] || [ "${GITHUB_REF}" != "refs/tags/${actual_tag}" ]; then
            echo "::error::The workflow must be triggered by the exact ${actual_tag} tag."
            exit 1
          fi
          if [ "${actual_subject}" != "${actual_tag}" ] || [ -n "${actual_body}" ]; then
            echo "::error::The release commit must use subject ${actual_tag} with an empty body."
            exit 1
          fi
          if [ "${actual_sha}" != "${EXPECTED_SHA}" ]; then
            echo "::error::Checked-out SHA does not match the requested candidate."
            exit 1
          fi
          if [ "${GITHUB_SHA}" != "${EXPECTED_SHA}" ]; then
            echo "::error::The workflow must run from the exact tagged release commit."
            exit 1
          fi
          git fetch --force origin main --tags
          remote_main="$(git rev-parse refs/remotes/origin/main)"
          tag_sha="$(git rev-parse "${EXPECTED_TAG}^{commit}")"
          tag_object_type="$(git cat-file -t "refs/tags/${EXPECTED_TAG}")"
          if [ "${tag_object_type}" != "commit" ]; then
            echo "::error::${EXPECTED_TAG} must be a lightweight tag."
            exit 1
          fi
          if [ "${tag_sha}" != "${EXPECTED_SHA}" ] || [ "${remote_main}" != "${EXPECTED_SHA}" ]; then
            echo "::error::The release tag, workflow SHA, and current main must identify the same commit."
            exit 1
          fi
          previous_tag="$(git tag --sort=-version:refname --merged "${EXPECTED_SHA}^" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)"
          previous_sha="$(git rev-parse "${previous_tag}^{commit}")"
          if [ "$(git rev-list --count "${previous_sha}..${EXPECTED_SHA}")" != "1" ]; then
            echo "::error::The release must add exactly one commit after ${previous_tag}."
            exit 1
          fi

      - name: Set up pinned Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Verify pinned publication helper is available
        run: |
          docker pull "${SKOPEO_IMAGE}"
          docker run --rm "${SKOPEO_IMAGE}" --version

      - name: Install constrained Python dependencies
        run: |
          python -m pip install --upgrade \
            -c deploy/requirements/runtime.constraints.txt \
            -r deploy/requirements/runtime.txt
          python -m pip install --upgrade \
            -c deploy/requirements/dev.constraints.txt \
            -r deploy/requirements/runtime.txt \
            -r deploy/requirements/dev.txt

      - name: Run source gates
        run: |
          python scripts/release/release_version_policy.py
          python -m compileall app/core app/ui/backend
          PYTHONPATH=app python -m pytest app/core/tests

      - name: Build verified static frontend
        working-directory: app/ui
        env:
          CHANNELWATCH_BUILD_ID: ${{ github.sha }}
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm lint
          pnpm test
          pnpm build
          pnpm exec playwright install --with-deps chromium firefox webkit
          pnpm exec playwright test

      - name: Rebuild and compare the complete application payload
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(jq -r '.version' scripts/release/release-config.json)"
          tag="v${version}"
          comparison_dir="${RUNNER_TEMP}/application-payload-comparison"
          runtime_app_root="${RUNNER_TEMP}/qualification-runtime-application"
          source_date_epoch="$(git show -s --format=%ct "${GITHUB_SHA}")"
          runtime_generation_required="$(jq -r '.runtime_generation_required // false' scripts/release/release-config.json)"
          comparison_signing_key="$(python - <<'PY'
          import base64
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
          key = Ed25519PrivateKey.generate().private_bytes(
              serialization.Encoding.Raw,
              serialization.PrivateFormat.Raw,
              serialization.NoEncryption(),
          )
          print(base64.b64encode(key).decode("ascii"))
          PY
          )"
          python -I - "${runtime_app_root}" "${version}" <<'PY'
          import importlib.util
          import sys
          from pathlib import Path
          script = Path("scripts/release/build-update-bundle.py").resolve()
          spec = importlib.util.spec_from_file_location("channelwatch_update_bundle", script)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          module.stage_runtime_application_payload(Path(sys.argv[1]), version=sys.argv[2])
          PY
          common_args=(
            --version "${version}"
            --bundle-url "https://github.com/CoderLuii/ChannelWatch/releases/download/${tag}/channelwatch-app-${tag}.zip"
            --release-url "https://github.com/CoderLuii/ChannelWatch/releases/tag/${tag}"
            --delivery-mode "$(jq -r '.delivery_mode' scripts/release/release-config.json)"
            --minimum-image-version "$(jq -r '.minimum_image_version' scripts/release/release-config.json)"
            --updater-protocol "$(jq -r '.updater_protocol' scripts/release/release-config.json)"
            --recommended-image-version "$(jq -r '.recommended_image_version' scripts/release/release-config.json)"
            --publication-time "$(jq -r '.publication_time' scripts/release/release-config.json)"
            --automatic-install-after "$(jq -r '.automatic_install_after' scripts/release/release-config.json)"
          )
          runtime_path_args=()
          runtime_url_args=()
          if [ "${runtime_generation_required}" = "true" ]; then
            mkdir -p "${comparison_dir}"
            for architecture in amd64 arm64; do
              dependency_archive="channelwatch-runtime-dependencies-${architecture}.tar"
              (cd "${RUNNER_TEMP}/runtime-dependencies" && sha256sum --check "${dependency_archive}.sha256")
              dependency_root="${RUNNER_TEMP}/qualification-runtime-${architecture}"
              mkdir -p "${dependency_root}"
              tar -xf "${RUNNER_TEMP}/runtime-dependencies/${dependency_archive}" -C "${dependency_root}"
              runtime_bundle="${comparison_dir}/channelwatch-runtime-${tag}-${architecture}.zip"
              python scripts/release/build-runtime-bundle.py \
                --app-root "${runtime_app_root}" \
                --dependency-root "${dependency_root}" \
                --output "${runtime_bundle}" \
                --application-version "${version}" --source-commit "${GITHUB_SHA}" \
                --settings-schema-version 7 --source-date-epoch "${source_date_epoch}"
              cmp --silent \
                "dist/candidate-one/channelwatch-runtime-${tag}-${architecture}.zip" \
                "${runtime_bundle}"
              runtime_path_args+=(--runtime-bundle "${architecture}=${runtime_bundle}")
              runtime_url_args+=(--runtime-bundle-url "${architecture}=https://github.com/CoderLuii/ChannelWatch/releases/download/${tag}/channelwatch-runtime-${tag}-${architecture}.zip")
            done
          fi
          CHANNELWATCH_COMPARISON_SIGNING_KEY="${comparison_signing_key}" \
            python scripts/release/build-update-bundle.py \
              --signing-key-env CHANNELWATCH_COMPARISON_SIGNING_KEY \
              "${common_args[@]}" "${runtime_path_args[@]}" "${runtime_url_args[@]}" \
              --out-dir "${comparison_dir}"
          cmp --silent \
            "dist/candidate-one/channelwatch-app-${tag}.zip" \
            "${comparison_dir}/channelwatch-app-${tag}.zip"

      # Browser checks use disposable API fixtures and run before signing secrets.
      - name: Retain browser diagnostics, including first failed attempts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-browser-${{ github.sha }}
          path: |
            app/ui/playwright-report/
            app/ui/test-results/
          retention-days: 7
          if-no-files-found: warn

      - name: Verify and extract native runtime dependency closures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/runtime-dependencies
          for architecture in amd64 arm64; do
            archive="channelwatch-runtime-dependencies-${architecture}.tar"
            (
              cd "${RUNNER_TEMP}/runtime-dependencies"
              sha256sum --check "${archive}.sha256"
            )
            mkdir "dist/runtime-dependencies/${architecture}"
            tar -xf "${RUNNER_TEMP}/runtime-dependencies/${archive}" \
              -C "dist/runtime-dependencies/${architecture}"
          done

      - name: Require byte-identical assets from the fresh signer
        shell: bash
        run: |
          set -euo pipefail
          diff -u \
            <(cd dist/candidate-one && sha256sum ./*) \
            <(cd dist/candidate-two && sha256sum ./*)
      - name: Verify app update frontend on the minimum compatible image
        shell: bash
        run: |
          set -euo pipefail
          version="$(jq -r '.version' scripts/release/release-config.json)"
          delivery_mode="$(jq -r '.delivery_mode' scripts/release/release-config.json)"
          minimum_image_version="$(jq -r '.minimum_image_version' scripts/release/release-config.json)"
          if [ "${delivery_mode}" = "image_required" ]; then
            echo "Skipping the app-update canary for an image-required release."
            exit 0
          fi
          python scripts/release/verify-minimum-image-app-update.py \
            --bundle "dist/candidate-one/channelwatch-app-v${version}.zip" \
            --runtime-bundle "dist/candidate-one/channelwatch-runtime-v${version}-amd64.zip" \
            --runtime-catalog "dist/candidate-one/channelwatch-update-catalog-v3.json" \
            --version "${version}" \
            --minimum-image-version "${minimum_image_version}" \
            --image-index-digest "$(jq -r '.minimum_image_sha256' scripts/release/release-config.json)" \
            --evidence-json "${RUNNER_TEMP}/channelwatch-minimum-image-app-update-v${version}.json"

      - name: Build exact deterministic multi-architecture image twice
        shell: bash
        run: |
          set -euo pipefail
          version="$(jq -r '.version' scripts/release/release-config.json)"
          source_epoch="$(git show -s --format=%ct "${GITHUB_SHA}")"
          build_date="$(python -c 'from datetime import datetime, timezone; import sys; print(datetime.fromtimestamp(int(sys.argv[1]), timezone.utc).isoformat().replace("+00:00", "Z"))' "${source_epoch}")"
          {
            echo "CANDIDATE_VERSION=${version}"
            echo "CANDIDATE_SOURCE_EPOCH=${source_epoch}"
            echo "CANDIDATE_BUILD_DATE=${build_date}"
          } >> "${GITHUB_ENV}"
          echo "Building exact candidate image from normalized source timestamp ${build_date}."

      - name: Build first exact multi-architecture image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: ${{ env.DOCKER_PLATFORMS }}
          push: false
          tags: channelwatch:release-candidate
          outputs: type=oci,dest=${{ runner.temp }}/channelwatch-candidate-one.oci,tar=false,rewrite-timestamp=true
          provenance: false
          no-cache: true
          build-args: |
            VERSION=${{ env.CANDIDATE_VERSION }}
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ env.CANDIDATE_BUILD_DATE }}
            SOURCE_DATE_EPOCH=${{ env.CANDIDATE_SOURCE_EPOCH }}

      - name: Build second exact multi-architecture image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: ${{ env.DOCKER_PLATFORMS }}
          push: false
          tags: channelwatch:release-candidate
          outputs: type=oci,dest=${{ runner.temp }}/channelwatch-candidate-two.oci,tar=false,rewrite-timestamp=true
          provenance: false
          no-cache: true
          build-args: |
            VERSION=${{ env.CANDIDATE_VERSION }}
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ env.CANDIDATE_BUILD_DATE }}
            SOURCE_DATE_EPOCH=${{ env.CANDIDATE_SOURCE_EPOCH }}

      - name: Verify and retain the exact candidate image
        shell: bash
        run: |
          set -euo pipefail
          tag="v${CANDIDATE_VERSION}"
          descriptor="dist/candidate-one/channelwatch-image-${tag}.json"
          digest="dist/candidate-one/channelwatch-image-${tag}.digest"
          archive="dist/candidate-one/channelwatch-image-${tag}.oci.tar"
          python scripts/release/describe-oci-image.py \
            --oci-layout "${RUNNER_TEMP}/channelwatch-candidate-one.oci" \
            --output "${descriptor}" \
            --digest-output "${digest}"
          python scripts/release/describe-oci-image.py \
            --oci-layout "${RUNNER_TEMP}/channelwatch-candidate-two.oci" \
            --output "${RUNNER_TEMP}/channelwatch-image-second.json" \
            --digest-output "${RUNNER_TEMP}/channelwatch-image-second.digest"
          cmp --silent "${descriptor}" "${RUNNER_TEMP}/channelwatch-image-second.json"
          cmp --silent "${digest}" "${RUNNER_TEMP}/channelwatch-image-second.digest"
          tar --sort=name \
            --mtime="@${CANDIDATE_SOURCE_EPOCH}" \
            --owner=0 --group=0 --numeric-owner \
            --format=posix \
            --pax-option=delete=atime,delete=ctime \
            -C "${RUNNER_TEMP}/channelwatch-candidate-one.oci" \
            -cf "${archive}" .
          second_archive="${RUNNER_TEMP}/channelwatch-image-second.oci.tar"
          tar --sort=name \
            --mtime="@${CANDIDATE_SOURCE_EPOCH}" \
            --owner=0 --group=0 --numeric-owner \
            --format=posix \
            --pax-option=delete=atime,delete=ctime \
            -C "${RUNNER_TEMP}/channelwatch-candidate-two.oci" \
            -cf "${second_archive}" .
          cmp --silent "${archive}" "${second_archive}"

      - name: Load exact-source AMD64 image for historical recovery canaries
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: channelwatch:v0.9.18-historical-recovery
          provenance: false
          build-args: |
            VERSION=${{ env.CANDIDATE_VERSION }}
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ env.CANDIDATE_BUILD_DATE }}
            SOURCE_DATE_EPOCH=${{ env.CANDIDATE_SOURCE_EPOCH }}

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.75.0
          cache: false

      - name: Install pinned Syft for runtime artifact qualification
        id: runtime_syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.54.1

      - name: Scan exact nonpublishing candidate image
        shell: bash
        run: |
          set -euo pipefail
          OCI_LAYOUT="${RUNNER_TEMP}/channelwatch-candidate-one.oci"
          tag="v${CANDIDATE_VERSION}"
          descriptor="dist/candidate-one/channelwatch-image-${tag}.json"
          for platform in linux/amd64 linux/arm64; do
            arch="${platform#linux/}"
            scan_archive="${RUNNER_TEMP}/channelwatch-scan-${arch}.tar"
            docker run --rm --pull=never \
              --volume "${OCI_LAYOUT}:/work/channelwatch.oci:ro" \
              --volume "${RUNNER_TEMP}:/output" \
              "${SKOPEO_IMAGE}" copy \
              --override-os linux \
              --override-arch "${arch}" \
              oci:/work/channelwatch.oci:release-candidate \
              "docker-archive:/output/channelwatch-scan-${arch}.tar:channelwatch-scan-${arch}:exact"
            expected_config_digest="$(jq -er --arg platform "${platform}" \
              '.platforms[] | select(.platform == $platform) | .config.digest' \
              "${descriptor}")"
            config_member="$(tar -xOf "${scan_archive}" manifest.json | jq -er \
              'if type == "array" and length == 1 and .[0].Config then .[0].Config else error("expected one archive manifest entry") end')"
            actual_config_digest="sha256:$(tar -xOf "${scan_archive}" "${config_member}" | sha256sum | awk '{print $1}')"
            config_architecture="$(tar -xOf "${scan_archive}" "${config_member}" | jq -er '.architecture')"
            config_os="$(tar -xOf "${scan_archive}" "${config_member}" | jq -er '.os')"
            if [ "${config_os}" != "linux" ] || [ "${config_architecture}" != "${arch}" ]; then
              echo "::error::Exported scan archive platform does not match ${platform}."
              exit 1
            fi
            if [ "${actual_config_digest}" != "${expected_config_digest}" ]; then
              echo "::error::Exported scan archive config does not match ${platform}."
              exit 1
            fi
            trivy image \
              --input "${scan_archive}" \
              --scanners vuln \
              --severity CRITICAL,HIGH,MEDIUM,LOW \
              --exit-code 0 \
              --format json \
              --output "${RUNNER_TEMP}/channelwatch-upstream-linux-${arch}.json"
            trivy image \
              --input "${scan_archive}" \
              --scanners secret,misconfig \
              --severity CRITICAL,HIGH \
              --exit-code 1
            rm -f "${scan_archive}"
          done

      - name: Retain accepted upstream image vulnerabilities
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upstream-image-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/channelwatch-upstream-linux-*.json
          retention-days: 30
          if-no-files-found: error

      - name: Verify pinned bridge or run v0.9.18 historical canaries
        shell: bash
        run: |
          set -euo pipefail
          version="$(jq -r '.version' scripts/release/release-config.json)"
          tag="v${version}"
          if [ "${version}" != "0.9.18" ]; then
            python scripts/release/verify-pinned-v1-bridge.py
            exit 0
          fi
          python scripts/release/verify-historical-image-canaries.py \
            --manifest "dist/candidate-one/channelwatch-update-${tag}.json" \
            --bundle "dist/candidate-one/channelwatch-app-${tag}.zip" \
            --version "${version}" \
            --recovery-image "channelwatch:v0.9.18-historical-recovery" \
            --evidence-json "dist/candidate-one/channelwatch-historical-image-canaries-${tag}.json"
          python - "dist/candidate-one/channelwatch-historical-image-canaries-${tag}.json" "${version}" <<'PY'
          import json
          import re
          import sys

          evidence_path, expected_version = sys.argv[1:]
          with open(evidence_path, encoding="utf-8") as handle:
              evidence = json.load(handle)

          expected_keys = {
              *(f'activation_success:0.9.{patch}' for patch in range(11, 18)),
              'activation_failure:0.9.15:ui',
              'activation_failure:0.9.17:core',
              'tamper_rejection:0.9.15:manifest',
              'tamper_rejection:0.9.15:bundle',
              'tamper_rejection:0.9.17:manifest',
              'tamper_rejection:0.9.17:bundle',
              'image_refresh_recovery:0.9.9',
              'image_refresh_recovery:0.9.10',
          }

          def fail(message):
              raise SystemExit(f"historical canary evidence is invalid: {message}")

          def row_key(row):
              scenario = row.get("scenario")
              source_version = row.get("source_version")
              scenario_id = row.get("scenario_key")
              if not all(isinstance(value, str) and value for value in (
                  scenario, source_version, scenario_id
              )):
                  fail("every result row must have scenario, scenario_key, and source_version")
              variant = (
                  row.get("failed_component") if scenario == "activation_failure"
                  else row.get("tamper_case") if scenario == "tamper_rejection"
                  else None
              )
              expected_id = ":".join(
                  str(value) for value in (scenario, source_version, variant) if value
              )
              if scenario_id != expected_id:
                  fail(f"scenario key {scenario_id!r} does not match {expected_id!r}")
              return scenario_id

          def require_fields(row, fields, key):
              missing = sorted(fields - row.keys())
              if missing:
                  fail(f"{key} is missing fields: {missing}")

          def require_exact(row, expected, key):
              for field, value in expected.items():
                  if row.get(field) != value:
                      fail(f"{key} has {field}={row.get(field)!r}, expected {value!r}")

          if evidence.get("schema") != 2:
              fail("schema must be exactly 2")
          if evidence.get("target_version") != expected_version:
              fail("target_version does not match the candidate")
          if evidence.get("platform") != "linux/amd64":
              fail("platform must be linux/amd64")
          if evidence.get("passed") is not True:
              fail("top-level passed must be true")
          results = evidence.get("results")
          if not isinstance(results, list):
              fail("results must be a list")

          keyed = {}
          for raw_row in results:
              if not isinstance(raw_row, dict):
                  fail("every result must be an object")
              row = dict(raw_row)
              key = row_key(row)
              if key in keyed:
                  fail(f"duplicate scenario row {key}")
              keyed[key] = row

          actual_keys = set(keyed)
          if actual_keys != expected_keys:
              fail(
                  f"scenario rows differ; missing={sorted(expected_keys - actual_keys)}, "
                  f"unexpected={sorted(actual_keys - expected_keys)}"
              )

          sha40 = re.compile(r"[0-9a-f]{40}\Z")
          sha64 = re.compile(r"[0-9a-f]{64}\Z")
          digest64 = re.compile(r"sha256:[0-9a-f]{64}\Z")
          bundle_digests = set()
          for key, row in keyed.items():
              scenario = row["scenario"]
              source_version = row["source_version"]
              failed_component = row.get("failed_component")
              tamper_case = row.get("tamper_case")
              expected_protocol = 0 if source_version == "0.9.9" else 1 if source_version <= "0.9.15" else 2
              if row.get("launcher_protocol") != expected_protocol:
                  fail(f"{key} has an incorrect launcher protocol")

              if scenario == "activation_success":
                  require_fields(row, {
                      "source_sha", "image_index_digest", "amd64_digest", "bundle_sha256",
                      "check_status", "apply_status", "final_job_status", "core_bundle",
                      "ui_bundle", "portal_api_verified", "restart_count_delta",
                      "supervisor_stable", "rollback_target_verified",
                      "active_identity_verified", "managed_key_verified",
                      "stale_control_file_count", "result",
                  }, key)
                  require_exact(row, {
                      "check_status": "available", "final_job_status": "success",
                      "core_bundle": True, "ui_bundle": True, "portal_api_verified": True,
                      "supervisor_stable": True, "rollback_target_verified": True,
                      "active_identity_verified": True, "managed_key_verified": True,
                      "stale_control_file_count": 0, "result": "passed",
                  }, key)
                  if not isinstance(row.get("apply_status"), str) or not row["apply_status"]:
                      fail(f"{key} has no apply status")
                  if type(row.get("restart_count_delta")) is not int or row["restart_count_delta"] < 1:
                      fail(f"{key} has an invalid restart delta")
              elif scenario == "activation_failure":
                  require_fields(row, {
                      "failed_component", "bundle_sha256", "portal_api_verified",
                      "restart_count_delta", "final_job_status", "rollback_applied",
                      "failed_identity_quarantined", "image_runtime_restored",
                      "supervisor_stable", "stale_control_file_count", "result",
                  }, key)
                  require_exact(row, {
                      "failed_component": failed_component, "portal_api_verified": True,
                      "final_job_status": "failed", "rollback_applied": True,
                      "failed_identity_quarantined": True, "image_runtime_restored": True,
                      "supervisor_stable": True, "stale_control_file_count": 0,
                      "result": "passed",
                  }, key)
                  if type(row.get("restart_count_delta")) is not int or row["restart_count_delta"] < 1:
                      fail(f"{key} has an invalid restart delta")
              elif scenario == "tamper_rejection":
                  require_fields(row, {
                      "tamper_case", "rejected_before_selection", "active_unchanged",
                      "restart_count_delta", "result",
                  }, key)
                  require_exact(row, {
                      "tamper_case": tamper_case, "rejected_before_selection": True,
                      "active_unchanged": True, "restart_count_delta": 0,
                      "result": "passed",
                  }, key)
              elif scenario == "image_refresh_recovery":
                  require_fields(row, {
                      "source_sha", "image_index_digest", "amd64_digest", "bundle_sha256",
                      "check_status", "apply_status", "image_refresh_required",
                      "recovery_job_status", "recovery_quorum_verified",
                      "recovery_image_runtime_verified", "managed_key_verified",
                      "supervisor_stable", "stale_control_file_count", "result",
                  }, key)
                  require_exact(row, {
                      "check_status": "available",
                      "image_refresh_required": True,
                      "recovery_job_status": "success", "recovery_quorum_verified": True,
                      "recovery_image_runtime_verified": True, "managed_key_verified": True,
                      "supervisor_stable": True, "stale_control_file_count": 0,
                      "result": "passed_with_documented_image_only_limitation",
                  }, key)
                  if not isinstance(row.get("apply_status"), str) or not row["apply_status"]:
                      fail(f"{key} has no apply status")
                  if source_version == "0.9.9":
                      require_exact(row, {
                          "immutable_false_success_observed": True,
                          "legacy_core_launcher_failure_observed": True,
                          "legacy_ui_image_runtime_verified": True,
                          "recovery_image_cleared_false_success": True,
                      }, key)
                  else:
                      require_exact(row, {
                          "portal_api_verified": True,
                          "immutable_entrypoint_failure_observed": True,
                          "legacy_restart_loop_observed": True,
                          "legacy_restart_count_at_least": 2,
                          "legacy_staged_identity_preserved": True,
                          "recovery_image_cleared_failed_activation": True,
                      }, key)
              else:
                  fail(f"{key} has an unsupported scenario {scenario!r}")

              if scenario in {"activation_success", "image_refresh_recovery"}:
                  if not sha40.fullmatch(str(row.get("source_sha", ""))):
                      fail(f"{key} has an invalid source SHA")
                  if not digest64.fullmatch(str(row.get("image_index_digest", ""))):
                      fail(f"{key} has an invalid image index digest")
                  if not digest64.fullmatch(str(row.get("amd64_digest", ""))):
                      fail(f"{key} has an invalid amd64 digest")
              if "bundle_sha256" in row:
                  if not sha64.fullmatch(str(row["bundle_sha256"])):
                      fail(f"{key} has an invalid bundle digest")
                  bundle_digests.add(row["bundle_sha256"])

          if len(bundle_digests) != 1:
              fail("all applicable rows must attest the same bundle digest")
          PY

      - name: Verify signed v1 bridge, v2 catalog, and exact source
        env:
          RUNTIME_SYFT_CMD: ${{ steps.runtime_syft.outputs.cmd }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(jq -r '.version' scripts/release/release-config.json)"
          tag="v${version}"
          delivery_mode="$(jq -r '.delivery_mode' scripts/release/release-config.json)"
          image_required="$(jq -r '.image_required' scripts/release/release-config.json)"
          recommended_image_version="$(jq -r '.recommended_image_version' scripts/release/release-config.json)"
          updater_protocol="$(jq -r '.updater_protocol' scripts/release/release-config.json)"
          runtime_generation_required="$(jq -r '.runtime_generation_required // false' scripts/release/release-config.json)"
          runtime_verify_args=()
          if [ "${updater_protocol}" = "4" ]; then
            runtime_verify_args=(
              --runtime-catalog "dist/candidate-one/channelwatch-update-catalog-v3.json"
              --expected-runtime-source-commit "${GITHUB_SHA}"
            )
            if [ "${runtime_generation_required}" = "true" ]; then
              for architecture in amd64 arm64; do
                runtime_verify_args+=(
                  --runtime-bundle "${architecture}=dist/candidate-one/channelwatch-runtime-${tag}-${architecture}.zip"
                  --expected-runtime-bundle-url "${architecture}=https://github.com/CoderLuii/ChannelWatch/releases/download/${tag}/channelwatch-runtime-${tag}-${architecture}.zip"
                )
              done
            fi
          fi
          python scripts/release/verify-update-assets.py \
            --release-config scripts/release/release-config.json \
            --manifest "dist/candidate-one/channelwatch-update-${tag}.json" \
            --catalog "dist/candidate-one/channelwatch-catalog-${tag}.json" \
            --bundle "dist/candidate-one/channelwatch-app-${tag}.zip" \
            --expected-version "${version}" \
            --expected-channel stable \
            --expected-runtime-abi channelwatch-runtime-v1 \
            --expected-settings-schema-version 7 \
            --expected-image-required "${image_required}" \
            --expected-delivery-mode "${delivery_mode}" \
            --expected-recommended-image-version "${recommended_image_version}" \
            --expected-git-sha "${GITHUB_SHA}" \
            --expected-release-url "https://github.com/CoderLuii/ChannelWatch/releases/tag/${tag}" \
            --expected-bundle-url "https://github.com/CoderLuii/ChannelWatch/releases/download/${tag}/channelwatch-app-${tag}.zip" \
            "${runtime_verify_args[@]}" \
            --source-root "${GITHUB_WORKSPACE}"
          compatibility_args=()
          if [ "${version}" = "0.9.18" ]; then
            python scripts/release/verify-legacy-update-bridge.py \
              --manifest "dist/candidate-one/channelwatch-update-${tag}.json" \
              --bundle "dist/candidate-one/channelwatch-app-${tag}.zip" \
              --version "${version}"
            compatibility_args=(
              --compatibility-manifest "dist/candidate-one/channelwatch-update-${tag}.json"
              --compatibility-bundle "dist/candidate-one/channelwatch-app-${tag}.zip"
              --historical-image-evidence "dist/candidate-one/channelwatch-historical-image-canaries-${tag}.json"
            )
          fi
          base_ref="$(git tag --sort=-version:refname --merged "${GITHUB_SHA}^" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)"
          if [ -z "${base_ref}" ]; then
            echo "::error::A previous semantic-version release tag is required for impact classification."
            exit 1
          fi
          minimum_image_args=()
          if [ "${delivery_mode}" != "image_required" ]; then
            minimum_image_args=(
              --minimum-image-app-update-evidence "${RUNNER_TEMP}/channelwatch-minimum-image-app-update-v${version}.json"
              --minimum-image-app-update-bundle "dist/candidate-one/channelwatch-app-${tag}.zip"
            )
          fi
          runtime_policy_args=()
          if [ "${updater_protocol}" = "4" ] && [ "${runtime_generation_required}" = "true" ]; then
            capability_evidence="dist/candidate-one/channelwatch-runtime-capability-${tag}.json"
            python scripts/release/aggregate-runtime-capability.py \
              --amd64-evidence "${RUNNER_TEMP}/runtime-capability/runtime-capability-amd64.json" \
              --arm64-evidence "${RUNNER_TEMP}/runtime-capability/runtime-capability-arm64.json" \
              --catalog "dist/candidate-one/channelwatch-update-catalog-v3.json" \
              --release-config scripts/release/release-config.json \
              --source-commit "${GITHUB_SHA}" \
              --output "${capability_evidence}"
            runtime_policy_args=(
              --runtime-catalog "dist/candidate-one/channelwatch-update-catalog-v3.json"
              --runtime-capability-evidence "${capability_evidence}"
            )
          fi
          python scripts/release/classify-release-impact.py \
            --base-ref "${base_ref}" \
            --target-ref "${GITHUB_SHA}" \
            "${compatibility_args[@]}" \
            "${minimum_image_args[@]}" \
            "${runtime_policy_args[@]}"
          python scripts/release/verify-publication-window.py \
            --catalog "dist/candidate-one/channelwatch-catalog-${tag}.json" \
            --version "${version}" \
            --prospective-publication-time "$(jq -r '.publication_time' scripts/release/release-config.json)"
          if [ "${runtime_generation_required}" = "true" ]; then
            runtime_scan_dir="${RUNNER_TEMP}/runtime-artifact-scan"
            trivy_cache_dir="${RUNNER_TEMP}/runtime-trivy-cache"
            install -d -m 0700 "${trivy_cache_dir}"
            syft_path="$(readlink -f "${RUNTIME_SYFT_CMD}")"
            trivy_path="$(readlink -f "$(command -v trivy)")"
            if [[ "${syft_path}" != /* ]] || [[ "${trivy_path}" != /* ]]; then
              echo "::error::Runtime scanners must resolve to absolute pinned executable paths."
              exit 1
            fi
            echo "dbf75864e7a7ff9e1fbf00552c31483f693188632a9f68f343cd7653dac513d6  ${syft_path}" | sha256sum --check --strict
            echo "93f9da8e4ba5e0c1c76d8234ed2494cf9afb0a96fd21953e424bb795f3299b8e  ${trivy_path}" | sha256sum --check --strict
            python scripts/release/scan-runtime-artifacts.py \
              --catalog "dist/candidate-one/channelwatch-update-catalog-v3.json" \
              --runtime-bundle "amd64=dist/candidate-one/channelwatch-runtime-${tag}-amd64.zip" \
              --runtime-bundle "arm64=dist/candidate-one/channelwatch-runtime-${tag}-arm64.zip" \
              --expected-runtime-bundle-url "amd64=https://github.com/CoderLuii/ChannelWatch/releases/download/${tag}/channelwatch-runtime-${tag}-amd64.zip" \
              --expected-runtime-bundle-url "arm64=https://github.com/CoderLuii/ChannelWatch/releases/download/${tag}/channelwatch-runtime-${tag}-arm64.zip" \
              --expected-version "${version}" \
              --expected-source-commit "${GITHUB_SHA}" \
              --syft "${syft_path}" \
              --trivy "${trivy_path}" \
              --trivy-cache-dir "${trivy_cache_dir}" \
              --output "${runtime_scan_dir}"
            tar --sort=name --owner=0 --group=0 --numeric-owner --format=posix \
              -C "${runtime_scan_dir}" \
              -cf "dist/candidate-one/channelwatch-runtime-scan-${tag}.tar" .
          fi
          legacy_evidence="dist/candidate-one/channelwatch-legacy-app-upgrade-${tag}-evidence.json"
          python scripts/release/aggregate-legacy-app-upgrades.py \
            --baselines scripts/release/legacy-app-upgrade-baselines.json \
            --release-config scripts/release/release-config.json \
            --receipts-directory "${RUNNER_TEMP}/legacy-app-upgrades" \
            --target-version "${version}" \
            --source-commit "${GITHUB_SHA}" \
            --catalog "dist/candidate-one/channelwatch-catalog-${tag}.json" \
            --bundle "dist/candidate-one/channelwatch-app-${tag}.zip" \
            --output "${legacy_evidence}"
          for architecture in amd64 arm64; do
            while IFS= read -r scenario; do
              receipt="${RUNNER_TEMP}/legacy-app-upgrades/legacy-app-upgrade-${architecture}-${scenario}.json"
              test -s "${receipt}"
              cp "${receipt}" "dist/candidate-one/channelwatch-legacy-app-upgrade-${tag}-${architecture}-${scenario}.json"
            done < <(jq -r '.scenarios[].id' scripts/release/legacy-app-upgrade-baselines.json)
          done
          find "${RUNNER_TEMP}/legacy-app-upgrades" \
            -mindepth 1 -maxdepth 1 -type d -name 'legacy-app-upgrade-*-logs' \
            -printf '%f\0' \
            | sort -z \
            | tar --null -C "${RUNNER_TEMP}/legacy-app-upgrades" --files-from=- \
                --sort=name --owner=0 --group=0 --numeric-owner --format=posix \
                -cf "dist/candidate-one/channelwatch-legacy-app-upgrade-${tag}-logs.tar"
          checksum_tmp="${RUNNER_TEMP}/channelwatch-candidate-SHA256SUMS.txt"
          (
            cd dist/candidate-one
            find . -maxdepth 1 -type f -print0 \
              | sort -z \
              | xargs -0 sha256sum > "${checksum_tmp}"
            sha256sum --check "${checksum_tmp}"
          )
          mv "${checksum_tmp}" dist/candidate-one/SHA256SUMS.txt

      - name: Encrypt qualified candidate for the final sealer
        shell: bash
        run: |
          set -euo pipefail
          transport_dir="dist/candidate-transport"
          archive="${RUNNER_TEMP}/channelwatch-release-candidate-${GITHUB_SHA}.tar"
          encrypted="${transport_dir}/channelwatch-release-candidate-${GITHUB_SHA}.transport"
          mkdir -p "${transport_dir}"
          tar -C dist/candidate-one -cf "${archive}" .
          python scripts/release/candidate-transport.py encrypt \
            --context "${RUNNER_TEMP}/candidate-signer/transport-context.json" \
            --public-key "${RUNNER_TEMP}/candidate-signer/transport-public.json" \
            --input "${archive}" \
            --output "${encrypted}" \
            --artifact-name "channelwatch-release-candidate-${GITHUB_SHA}.tar"
          rm -f "${archive}"
          if [ ! -s "${encrypted}" ]; then
            echo "::error::Encrypted qualification artifact was not created."
            exit 1
          fi

      - name: Retain encrypted qualification evidence
        id: candidate_upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-qualification-${{ github.sha }}
          path: dist/candidate-transport/*.transport
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  signed-candidate:
    name: Finalize sealed qualified candidate on a fresh runner
    needs: [candidate-signing, candidate-qualification]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.candidate_upload.outputs.artifact-id }}
    steps:
      - name: Checkout exact audited sealer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Download signer key material
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: candidate-signer-${{ github.sha }}
          path: ${{ runner.temp }}/candidate-signer
      - name: Download encrypted qualification evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: candidate-qualification-${{ github.sha }}
          path: ${{ runner.temp }}/candidate-qualification
      - name: Download audited opener dependencies
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: runtime-dependencies-amd64-${{ github.sha }}
          path: ${{ runner.temp }}/opener-runtime
      - name: Open qualification and create the final production seal
        env:
          CHANNELWATCH_UPDATE_SIGNING_KEY: ${{ secrets.CHANNELWATCH_UPDATE_SIGNING_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          signing_key="${CHANNELWATCH_UPDATE_SIGNING_KEY}"
          test -n "${signing_key}"
          unset CHANNELWATCH_UPDATE_SIGNING_KEY
          (cd "${RUNNER_TEMP}/opener-runtime" && sha256sum --check channelwatch-runtime-dependencies-amd64.tar.sha256)
          mkdir -p "${RUNNER_TEMP}/opener-dependencies"
          tar -xf "${RUNNER_TEMP}/opener-runtime/channelwatch-runtime-dependencies-amd64.tar" \
            -C "${RUNNER_TEMP}/opener-dependencies"
          export PYTHONPATH="${RUNNER_TEMP}/opener-dependencies/dependencies/site-packages"
          archive="${RUNNER_TEMP}/channelwatch-release-candidate-${GITHUB_SHA}.tar"
          CHANNELWATCH_UPDATE_SIGNING_KEY="${signing_key}" python scripts/release/candidate-transport.py decrypt \
            --context "${RUNNER_TEMP}/candidate-signer/transport-context.json" \
            --sealed-private-key "${RUNNER_TEMP}/candidate-signer/transport-private.sealed" \
            --input "${RUNNER_TEMP}/candidate-qualification/channelwatch-release-candidate-${GITHUB_SHA}.transport" \
            --output "${archive}" \
            --artifact-name "channelwatch-release-candidate-${GITHUB_SHA}.tar"
          mkdir -p dist/candidate-sealed
          CHANNELWATCH_UPDATE_SIGNING_KEY="${signing_key}" python scripts/release/seal-candidate-artifact.py seal \
            --input "${archive}" \
            --output "dist/candidate-sealed/channelwatch-release-candidate-${GITHUB_SHA}.sealed"
          rm -f "${archive}"
      - name: Retain sealed nonpublishing candidate evidence
        id: candidate_upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: channelwatch-release-candidate-${{ github.sha }}
          path: dist/candidate-sealed/*.sealed
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  native-image-qualification:
    name: Native image qualification (${{ matrix.architecture }})
    needs: [signed-candidate, runtime-dependencies]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout exact native verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up pinned Python for the audited opener
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Install exact binary opener dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          --only-binary=:all: --require-hashes
          -r scripts/release/signer-requirements.txt
      - name: Download exact sealed candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.signed-candidate.outputs.artifact_id }}
          path: ${{ runner.temp }}/native-candidate
      - name: Download the native verifier dependency closure
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: runtime-dependencies-${{ matrix.architecture }}-${{ github.sha }}
          path: ${{ runner.temp }}/native-verifier-runtime
      - name: Open exact candidate before native qualification
        env:
          CHANNELWATCH_UPDATE_SIGNING_KEY: ${{ secrets.CHANNELWATCH_UPDATE_SIGNING_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          signing_key="${CHANNELWATCH_UPDATE_SIGNING_KEY}"
          test -n "${signing_key}"
          unset CHANNELWATCH_UPDATE_SIGNING_KEY
          candidate_dir="${RUNNER_TEMP}/native-candidate"
          CHANNELWATCH_UPDATE_SIGNING_KEY="${signing_key}" python scripts/release/seal-candidate-artifact.py open \
            --input "${candidate_dir}/channelwatch-release-candidate-${GITHUB_SHA}.sealed" \
            --output "${RUNNER_TEMP}/native-candidate.tar"
          tar -xf "${RUNNER_TEMP}/native-candidate.tar" -C "${candidate_dir}"
          rm -f "${RUNNER_TEMP}/native-candidate.tar" "${candidate_dir}"/*.sealed
          (cd "${candidate_dir}" && sha256sum --check SHA256SUMS.txt)
      - name: Prepare the native verifier dependency closure
        env:
          NATIVE_ARCHITECTURE: ${{ matrix.architecture }}
          RUNTIME_BUILDER_DIGEST: sha256:48b13b003dda20b16f9442b8475aa05fe21bf6579a8c881db92ffb4d8fd20f83
        shell: bash
        run: |
          set -euo pipefail
          runtime_root="${RUNNER_TEMP}/native-verifier-runtime"
          archive="channelwatch-runtime-dependencies-${NATIVE_ARCHITECTURE}.tar"
          (cd "${runtime_root}" && sha256sum --check "${archive}.sha256")
          dependency_root="${RUNNER_TEMP}/native-verifier-dependencies"
          test ! -e "${dependency_root}"
          install -d -m 0700 "${dependency_root}"
          python - "${runtime_root}/${archive}" "${dependency_root}" \
            "${NATIVE_ARCHITECTURE}" "${RUNTIME_BUILDER_DIGEST}" <<'PY'
          import hashlib
          import json
          import os
          import re
          import shutil
          import stat
          import sys
          import tarfile
          from pathlib import Path, PurePosixPath

          archive = Path(sys.argv[1])
          destination = Path(sys.argv[2]).resolve()
          architecture = sys.argv[3]
          builder_digest = sys.argv[4]
          wheel_platform = {
              "amd64": "manylinux_2_36_x86_64",
              "arm64": "manylinux_2_36_aarch64",
          }.get(architecture)
          if wheel_platform is None:
              raise SystemExit("Unsupported runtime dependency architecture.")
          max_members = 10_000
          max_file_size = 128 * 1024 * 1024
          max_total_size = 512 * 1024 * 1024
          sha256 = re.compile(r"[0-9a-f]{64}")

          def normalized(member: tarfile.TarInfo) -> str:
              if "\\" in member.name or "\x00" in member.name or member.name.startswith("/"):
                  raise SystemExit("Runtime dependency archive contains an unsafe path.")
              path = PurePosixPath(member.name)
              if any(part == ".." for part in path.parts):
                  raise SystemExit("Runtime dependency archive contains an unsafe path.")
              value = str(path)
              if value != "." and value != "dependencies" and not value.startswith("dependencies/"):
                  raise SystemExit("Runtime dependency archive contains an unexpected path.")
              return value

          with tarfile.open(archive, "r:") as handle:
              members = handle.getmembers()
              if not members or len(members) > max_members:
                  raise SystemExit("Runtime dependency archive member count is invalid.")
              rows = {}
              total_size = 0
              for member in members:
                  name = normalized(member)
                  if name in rows:
                      raise SystemExit("Runtime dependency archive has duplicate paths.")
                  if (
                      member.issym()
                      or member.islnk()
                      or member.isdev()
                      or not (member.isfile() or member.isdir())
                  ):
                      raise SystemExit("Runtime dependency archive contains an unsafe member type.")
                  if member.size < 0 or member.size > max_file_size:
                      raise SystemExit("Runtime dependency archive member size is invalid.")
                  total_size += member.size
                  if total_size > max_total_size:
                      raise SystemExit("Runtime dependency archive is too large.")
                  rows[name] = member

              inventory_member = rows.get("dependencies/inventory.json")
              if inventory_member is None or not inventory_member.isfile():
                  raise SystemExit("Runtime dependency inventory is missing.")
              inventory_file = handle.extractfile(inventory_member)
              if inventory_file is None:
                  raise SystemExit("Runtime dependency inventory cannot be read.")
              inventory = json.load(inventory_file)
              if set(inventory) != {
                  "schema", "build", "platform", "requirements", "artifacts",
                  "dependencies", "files", "counts",
              } or inventory["schema"] != 1:
                  raise SystemExit("Runtime dependency inventory schema is invalid.")
              if inventory["build"] != {
                  "builder_image_digest": builder_digest,
                  "pip_version": "26.2.1",
                  "python_version": "3.14.8",
              }:
                  raise SystemExit("Runtime dependency build identity is invalid.")
              if inventory["platform"] != {
                  "architecture": architecture,
                  "python_implementation": "cpython",
                  "python_cache_tag": "cpython-314",
                  "python_version": "3.14.8",
                  "os_family": "linux",
                  "libc_family": "glibc",
                  "minimum_libc_version": "2.36",
                  "wheel_platform": wheel_platform,
              }:
                  raise SystemExit("Runtime dependency platform is invalid.")
              requirements = inventory["requirements"]
              if not isinstance(requirements, dict) or set(requirements) != {"direct", "locked"}:
                  raise SystemExit("Runtime dependency requirements are invalid.")
              if not isinstance(requirements["direct"], list) or "httpx" not in requirements["direct"]:
                  raise SystemExit("Runtime dependency direct requirements are invalid.")
              locked = requirements["locked"]
              if not isinstance(locked, list) or not locked:
                  raise SystemExit("Runtime dependency lock is empty.")
              locked_names = set()
              for row in locked:
                  if not isinstance(row, dict) or set(row) != {"name", "version", "hashes"}:
                      raise SystemExit("Runtime dependency lock row is invalid.")
                  hashes = row["hashes"]
                  if (
                      not isinstance(row["name"], str)
                      or not row["name"]
                      or row["name"] in locked_names
                      or not isinstance(row["version"], str)
                      or not row["version"]
                      or not isinstance(hashes, list)
                      or not hashes
                      or any(not isinstance(value, str) or sha256.fullmatch(value) is None for value in hashes)
                  ):
                      raise SystemExit("Runtime dependency lock row is invalid.")
                  locked_names.add(row["name"])
              if not isinstance(inventory["artifacts"], list) or not isinstance(inventory["dependencies"], list):
                  raise SystemExit("Runtime dependency inventory metadata is invalid.")

              inventory_rows = inventory["files"]
              if not isinstance(inventory_rows, list) or not inventory_rows:
                  raise SystemExit("Runtime dependency file inventory is empty.")
              expected_files = {}
              for row in inventory_rows:
                  if not isinstance(row, dict) or set(row) != {"path", "sha256", "size", "mode"}:
                      raise SystemExit("Runtime dependency file row is invalid.")
                  path = row["path"]
                  if (
                      not isinstance(path, str)
                      or not path.startswith("dependencies/site-packages/")
                      or path in expected_files
                      or not isinstance(row["size"], int)
                      or row["size"] < 0
                      or row["size"] > max_file_size
                      or row["mode"] not in {"0644", "0755"}
                      or not isinstance(row["sha256"], str)
                      or sha256.fullmatch(row["sha256"]) is None
                  ):
                      raise SystemExit("Runtime dependency file row is invalid.")
                  expected_files[path] = row
              archive_files = {
                  name for name, member in rows.items()
                  if member.isfile() and name != "dependencies/inventory.json"
              }
              if archive_files != set(expected_files):
                  raise SystemExit("Runtime dependency archive and inventory differ.")
              expected_directories = {".", "dependencies", "dependencies/site-packages"}
              for path in expected_files:
                  parent = PurePosixPath(path).parent
                  while str(parent) not in {"", "."}:
                      expected_directories.add(str(parent))
                      parent = parent.parent
              if {name for name, member in rows.items() if member.isdir()} != expected_directories:
                  raise SystemExit("Runtime dependency archive has untracked directories.")
              if inventory["counts"] != {
                  "files": len(expected_files),
                  "bytes": sum(row["size"] for row in expected_files.values()),
              }:
                  raise SystemExit("Runtime dependency inventory counts are invalid.")

              for name, member in rows.items():
                  target = destination if name == "." else destination.joinpath(*PurePosixPath(name).parts)
                  if destination not in (target, *target.parents):
                      raise SystemExit("Runtime dependency extraction escaped its destination.")
                  if member.isdir():
                      target.mkdir(mode=0o755, parents=True, exist_ok=True)
                      continue
                  target.parent.mkdir(mode=0o755, parents=True, exist_ok=True)
                  source = handle.extractfile(member)
                  if source is None:
                      raise SystemExit("Runtime dependency archive member cannot be read.")
                  flags = os.O_WRONLY | os.O_CREAT | os.O_EXCL
                  if hasattr(os, "O_NOFOLLOW"):
                      flags |= os.O_NOFOLLOW
                  descriptor = os.open(target, flags, 0o600)
                  with source, os.fdopen(descriptor, "wb") as output:
                      shutil.copyfileobj(source, output, length=1024 * 1024)
                  if name == "dependencies/inventory.json":
                      os.chmod(target, 0o600)
                      continue
                  row = expected_files[name]
                  digest = hashlib.sha256()
                  with target.open("rb") as extracted:
                      while chunk := extracted.read(1024 * 1024):
                          digest.update(chunk)
                  if target.stat().st_size != row["size"] or digest.hexdigest() != row["sha256"]:
                      raise SystemExit("Extracted runtime dependency content is invalid.")
                  os.chmod(target, int(row["mode"], 8))
                  if stat.S_IMODE(target.stat().st_mode) != int(row["mode"], 8):
                      raise SystemExit("Extracted runtime dependency mode is invalid.")
          PY
          echo "PYTHONPATH=${dependency_root}/dependencies/site-packages" >> "${GITHUB_ENV}"
      - name: Set up pinned Node.js after the signing key is removed
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install the existing headless browser harness
        working-directory: app/ui
        run: |
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm exec playwright install --with-deps chromium
      - name: Qualify exact native OCI child without rebuilding
        env:
          NATIVE_ARCHITECTURE: ${{ matrix.architecture }}
        shell: bash
        run: |
          set -euo pipefail
          candidate_dir="${RUNNER_TEMP}/native-candidate"
          version="$(jq -r '.version' scripts/release/release-config.json)"
          tag="v${version}"
          archive="${candidate_dir}/channelwatch-image-${tag}.oci.tar"
          descriptor="${candidate_dir}/channelwatch-image-${tag}.json"
          archive_sha="$(sha256sum "${archive}" | awk '{print $1}')"
          descriptor_sha="$(sha256sum "${descriptor}" | awk '{print $1}')"
          docker pull "${SKOPEO_IMAGE}"
          python scripts/release/verify-native-image.py \
            --oci-archive "${archive}" \
            --descriptor "${descriptor}" \
            --expected-archive-sha256 "${archive_sha}" \
            --expected-descriptor-sha256 "${descriptor_sha}" \
            --source-commit "${GITHUB_SHA}" \
            --version "${version}" \
            --architecture "${NATIVE_ARCHITECTURE}" \
            --skopeo-image "${SKOPEO_IMAGE}" \
            --receipt "${RUNNER_TEMP}/native-image-${NATIVE_ARCHITECTURE}.json" \
            --log-output "${RUNNER_TEMP}/native-image-${NATIVE_ARCHITECTURE}.log"
          jq -e \
            --arg architecture "${NATIVE_ARCHITECTURE}" \
            --arg source_commit "${GITHUB_SHA}" \
            --arg version "${version}" \
            '.schema == 1 and .status == "passed" and .native == true and
             .architecture == $architecture and .source_commit == $source_commit and
             .version == $version and .launcher_protocol == 4 and .runtime_ready == true and .cli == true and
             .headless_browser == true and .same_container_restart == true and
             .persistence == true' \
            "${RUNNER_TEMP}/native-image-${NATIVE_ARCHITECTURE}.json" >/dev/null
      - name: Qualify published older installations on the foundation image
        env:
          NATIVE_ARCHITECTURE: ${{ matrix.architecture }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(jq -r '.version' scripts/release/release-config.json)"
          test "${RELEASE_TAG}" = "v${version}"
          recovery="$(jq -r '.recovers_unpublished_image_milestone // empty' scripts/release/release-config.json)"
          if [ -z "${recovery}" ]; then
            exit 0
          fi
          fixtures="scripts/release/image-upgrade-baselines.json"
          test "$(jq -r '.candidate_version' "${fixtures}")" = "${version}"
          test "$(jq -r '.recovers_unpublished_image_milestone' "${fixtures}")" = "${recovery}"
          baseline_dir="${RUNNER_TEMP}/image-upgrade-baselines"
          mkdir -p "${baseline_dir}"
          catalog="${baseline_dir}/catalog.json"
          bundle="${baseline_dir}/app.zip"
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            "$(jq -r '.signed_app.catalog_url' "${fixtures}")" --output "${catalog}"
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            "$(jq -r '.signed_app.bundle_url' "${fixtures}")" --output "${bundle}"
          printf '%s  %s\n' "$(jq -r '.signed_app.catalog_sha256' "${fixtures}")" "${catalog}" \
            "$(jq -r '.signed_app.bundle_sha256' "${fixtures}")" "${bundle}" | sha256sum --check
          python - "${fixtures}" "${catalog}" "${bundle}" <<'PY'
          import importlib.util
          import json
          import sys
          from pathlib import Path

          script = Path("scripts/release/verify-image-upgrade.py").resolve()
          spec = importlib.util.spec_from_file_location("image_upgrade_dependency_preflight", script)
          if spec is None or spec.loader is None:
              raise SystemExit("Could not load the image-upgrade verifier.")
          verifier = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(verifier)
          for index, attribute in enumerate(
              ("ASSET_VERIFIER", "NATIVE_VERIFIER", "CAPABILITY_VERIFIER"), start=1
          ):
              verifier._load_script(
                  getattr(verifier, attribute), f"image_upgrade_dependency_preflight_{index}"
              )
          fixtures = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          release, bundle_url = verifier.verify_signed_baseline_assets(
              Path(sys.argv[2]),
              Path(sys.argv[3]),
              version=fixtures["signed_app"]["version"],
              source_commit=fixtures["signed_app"]["source_commit"],
          )
          if release.get("version") != fixtures["signed_app"]["version"]:
              raise SystemExit("The signed baseline release version does not match.")
          if bundle_url != fixtures["signed_app"]["bundle_url"]:
              raise SystemExit("The signed baseline bundle URL does not match.")
          PY
          candidate_dir="${RUNNER_TEMP}/native-candidate"
          archive="${candidate_dir}/channelwatch-image-v${version}.oci.tar"
          descriptor="${candidate_dir}/channelwatch-image-v${version}.json"
          archive_sha="$(sha256sum "${archive}" | awk '{print $1}')"
          descriptor_sha="$(sha256sum "${descriptor}" | awk '{print $1}')"
          for baseline in 1.4.0 1.4.1; do
            python scripts/release/verify-image-upgrade.py \
              --candidate-oci-archive "${archive}" \
              --candidate-descriptor "${descriptor}" \
              --expected-archive-sha256 "${archive_sha}" \
              --expected-descriptor-sha256 "${descriptor_sha}" \
              --candidate-version "${version}" \
              --source-commit "${GITHUB_SHA}" \
              --architecture "${NATIVE_ARCHITECTURE}" \
              --skopeo-image "${SKOPEO_IMAGE}" \
              --baseline-repository "$(jq -r '.repository' "${fixtures}")" \
              --baseline-image-version "${baseline}" \
              --baseline-source-commit "$(jq -r --arg baseline "${baseline}" '.images[$baseline].source_commit' "${fixtures}")" \
              --baseline-index-digest "$(jq -r --arg baseline "${baseline}" '.images[$baseline].index_digest' "${fixtures}")" \
              --baseline-manifest-digest "$(jq -r --arg baseline "${baseline}" --arg architecture "${NATIVE_ARCHITECTURE}" '.images[$baseline].manifests[$architecture]' "${fixtures}")" \
              --baseline-app-version "$(jq -r '.signed_app.version' "${fixtures}")" \
              --baseline-app-source-commit "$(jq -r '.signed_app.source_commit' "${fixtures}")" \
              --baseline-catalog "${catalog}" \
              --baseline-bundle "${bundle}" \
              --receipt "${RUNNER_TEMP}/native-image-upgrade-${NATIVE_ARCHITECTURE}-${baseline}.json" \
              --log-directory "${RUNNER_TEMP}/native-image-upgrade-${NATIVE_ARCHITECTURE}-${baseline}-logs"
          done
      - name: Retain native image qualification receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-image-${{ matrix.architecture }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/native-image-${{ matrix.architecture }}.json
            ${{ runner.temp }}/native-image-${{ matrix.architecture }}.log
            ${{ runner.temp }}/native-image-upgrade-${{ matrix.architecture }}-*.json
            ${{ runner.temp }}/native-image-upgrade-${{ matrix.architecture }}-*-logs/
          if-no-files-found: warn
          retention-days: 30

  build-update-bundle-and-release:
    name: Build signed update bundle and release
    needs: [signed-candidate, native-image-qualification]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write # Create the exact-SHA draft and upload signed update assets.
      actions: read # Reproduce and compare the approved nonpublishing candidate.
    outputs:
      bundle_url: ${{ steps.assets.outputs.bundle_url }}
      manifest_url: ${{ steps.assets.outputs.manifest_url }}
      catalog_url: ${{ steps.assets.outputs.catalog_url }}
      catalog_sha256: ${{ steps.assets.outputs.catalog_sha256 }}
      runtime_catalog_url: ${{ steps.assets.outputs.runtime_catalog_url }}
      runtime_catalog_sha256: ${{ steps.assets.outputs.runtime_catalog_sha256 }}
      bundle_sha256: ${{ steps.assets.outputs.bundle_sha256 }}
      approved_candidate_artifact_id: ${{ steps.approved_candidate.outputs.artifact_id }}
      approved_image_index_digest: ${{ steps.approved_candidate.outputs.image_index_digest }}
      approved_image_descriptor_sha256: ${{ steps.approved_candidate.outputs.image_descriptor_sha256 }}
      approved_image_archive_sha256: ${{ steps.approved_candidate.outputs.image_archive_sha256 }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Download audited opener dependencies
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: runtime-dependencies-amd64-${{ github.sha }}
          path: ${{ runner.temp }}/opener-runtime
      - name: Download the exact qualified candidate seal
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.signed-candidate.outputs.artifact_id }}
          path: ${{ runner.temp }}/approved-candidate
      - name: Download exact native image qualification evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: native-image-*-${{ github.sha }}
          path: ${{ runner.temp }}/native-image-evidence
          merge-multiple: true

      - name: Open the exact qualified candidate before release checks
        id: approved_candidate
        env:
          APPROVED_ARTIFACT_ID: ${{ needs.signed-candidate.outputs.artifact_id }}
          CHANNELWATCH_UPDATE_SIGNING_KEY: ${{ secrets.CHANNELWATCH_UPDATE_SIGNING_KEY }}
          TAG: ${{ env.RELEASE_TAG }}
        shell: bash
        run: |
          set -euo pipefail
          signing_key="${CHANNELWATCH_UPDATE_SIGNING_KEY}"
          test -n "${signing_key}"
          unset CHANNELWATCH_UPDATE_SIGNING_KEY
          (cd "${RUNNER_TEMP}/opener-runtime" && sha256sum --check channelwatch-runtime-dependencies-amd64.tar.sha256)
          mkdir -p "${RUNNER_TEMP}/opener-dependencies"
          tar -xf "${RUNNER_TEMP}/opener-runtime/channelwatch-runtime-dependencies-amd64.tar" \
            -C "${RUNNER_TEMP}/opener-dependencies"
          export PYTHONPATH="${RUNNER_TEMP}/opener-dependencies/dependencies/site-packages"
          if [[ ! "${APPROVED_ARTIFACT_ID}" =~ ^[0-9]+$ ]]; then
            echo "::error::The verification job did not produce an approved candidate artifact."
            exit 1
          fi
          approved_dir="${RUNNER_TEMP}/approved-candidate"
          mkdir -p "${approved_dir}" dist/update
          candidate_seal="${approved_dir}/channelwatch-release-candidate-${RELEASE_SHA}.sealed"
          candidate_seal_sha256="$(sha256sum "${candidate_seal}" | awk '{print $1}')"
          CHANNELWATCH_UPDATE_SIGNING_KEY="${signing_key}" python scripts/release/seal-candidate-artifact.py open \
            --input "${candidate_seal}" \
            --output "${RUNNER_TEMP}/approved-candidate.tar"
          tar -xf "${RUNNER_TEMP}/approved-candidate.tar" -C "${approved_dir}"
          rm -f "${RUNNER_TEMP}/approved-candidate.tar" "${approved_dir}"/*.sealed
          (cd "${approved_dir}" && sha256sum --check SHA256SUMS.txt)
          cp "${approved_dir}/channelwatch-app-${TAG}.zip" dist/update/
          cp "${approved_dir}/channelwatch-update-${TAG}.json" dist/update/
          cp "${approved_dir}/channelwatch-catalog-${TAG}.json" dist/update/
          mapfile -d '' legacy_assets < <(
            find "${approved_dir}" -maxdepth 1 -type f \
              -name "channelwatch-legacy-app-upgrade-${TAG}-*" -print0 \
              | sort -z
          )
          expected_legacy_assets=$((2 + (2 * $(jq '.scenarios | length' scripts/release/legacy-app-upgrade-baselines.json))))
          if [ "${#legacy_assets[@]}" -ne "${expected_legacy_assets}" ] || [ ! -f "${legacy_assets[0]:-}" ]; then
            echo "::error::The approved candidate does not contain the exact legacy upgrade evidence matrix."
            exit 1
          fi
          cp "${legacy_assets[@]}" dist/update/
          if [ "$(jq -r '.updater_protocol' scripts/release/release-config.json)" = "4" ]; then
            cp "${approved_dir}/channelwatch-update-catalog-v3.json" dist/update/
          fi
          if [ "$(jq -r '.runtime_generation_required // false' scripts/release/release-config.json)" = "true" ]; then
            cp "${approved_dir}/channelwatch-runtime-capability-${TAG}.json" dist/update/
            cp "${approved_dir}/channelwatch-runtime-${TAG}-amd64.zip" dist/update/
            cp "${approved_dir}/channelwatch-runtime-${TAG}-arm64.zip" dist/update/
            cp "${approved_dir}/channelwatch-runtime-scan-${TAG}.tar" dist/update/
          fi
          image_descriptor="channelwatch-image-${TAG}.json"
          image_digest="channelwatch-image-${TAG}.digest"
          image_archive="channelwatch-image-${TAG}.oci.tar"
          image_index_digest="$(tr -d '\r\n' < "${approved_dir}/${image_digest}")"
          [[ "${image_index_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          {
            echo "artifact_id=${APPROVED_ARTIFACT_ID}"
            echo "candidate_seal_sha256=${candidate_seal_sha256}"
            echo "image_index_digest=${image_index_digest}"
            echo "image_descriptor_sha256=$(sha256sum "${approved_dir}/${image_descriptor}" | awk '{print $1}')"
            echo "image_archive_sha256=$(sha256sum "${approved_dir}/${image_archive}" | awk '{print $1}')"
          } >> "${GITHUB_OUTPUT}"

      - name: Bind native qualification evidence to the exact signed candidate
        env:
          CANDIDATE_SEAL_SHA256: ${{ steps.approved_candidate.outputs.candidate_seal_sha256 }}
          EXPECTED_ARCHIVE_SHA256: ${{ steps.approved_candidate.outputs.image_archive_sha256 }}
          EXPECTED_DESCRIPTOR_SHA256: ${{ steps.approved_candidate.outputs.image_descriptor_sha256 }}
          EXPECTED_IMAGE_INDEX_DIGEST: ${{ steps.approved_candidate.outputs.image_index_digest }}
          TAG: ${{ env.RELEASE_TAG }}
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="${RUNNER_TEMP}/native-image-evidence"
          output_dir="dist/update"
          version="${TAG#v}"
          manifest="${output_dir}/channelwatch-native-image-${TAG}-evidence.json"
          jq -n \
            --arg source_commit "${RELEASE_SHA}" \
            --arg version "${version}" \
            --arg candidate_seal_sha256 "${CANDIDATE_SEAL_SHA256}" \
            --arg image_index_digest "${EXPECTED_IMAGE_INDEX_DIGEST}" \
            --arg oci_archive_sha256 "${EXPECTED_ARCHIVE_SHA256}" \
            --arg descriptor_sha256 "${EXPECTED_DESCRIPTOR_SHA256}" \
            '{schema: 1, source_commit: $source_commit, version: $version,
              candidate_seal_sha256: $candidate_seal_sha256,
              image_index_digest: $image_index_digest,
              oci_archive_sha256: $oci_archive_sha256,
              descriptor_sha256: $descriptor_sha256,
              architectures: []}' > "${manifest}"
          for architecture in amd64 arm64; do
            receipt="${evidence_dir}/native-image-${architecture}.json"
            log="${evidence_dir}/native-image-${architecture}.log"
            test -s "${receipt}"
            test -f "${log}"
            log_sha256="$(sha256sum "${log}" | awk '{print $1}')"
            jq -e \
              --arg architecture "${architecture}" \
              --arg source_commit "${RELEASE_SHA}" \
              --arg version "${version}" \
              --arg archive_sha256 "${EXPECTED_ARCHIVE_SHA256}" \
              --arg descriptor_sha256 "${EXPECTED_DESCRIPTOR_SHA256}" \
              --arg image_index_digest "${EXPECTED_IMAGE_INDEX_DIGEST}" \
              --arg log_sha256 "${log_sha256}" \
              '.schema == 1 and .status == "passed" and .native == true and
               .architecture == $architecture and .source_commit == $source_commit and
               .version == $version and .oci_archive_sha256 == $archive_sha256 and
               .descriptor_sha256 == $descriptor_sha256 and
               .image_index_digest == $image_index_digest and
               .container_log_sha256 == $log_sha256 and
               .launcher_protocol == 4 and .runtime_ready == true and .cli == true and .headless_browser == true and
               .same_container_restart == true and .persistence == true' \
              "${receipt}" >/dev/null
            public_receipt="${output_dir}/channelwatch-native-image-${TAG}-${architecture}.json"
            public_log="${output_dir}/channelwatch-native-image-${TAG}-${architecture}.log"
            cp "${receipt}" "${public_receipt}"
            cp "${log}" "${public_log}"
            receipt_sha256="$(sha256sum "${public_receipt}" | awk '{print $1}')"
            updated="${RUNNER_TEMP}/native-image-evidence-${architecture}.json"
            jq \
              --arg architecture "${architecture}" \
              --arg receipt_sha256 "${receipt_sha256}" \
              --arg log_sha256 "${log_sha256}" \
              '.architectures += [{architecture: $architecture,
                receipt_sha256: $receipt_sha256, log_sha256: $log_sha256}]' \
              "${manifest}" > "${updated}"
            mv "${updated}" "${manifest}"
          done
          jq -e \
            '.schema == 1 and
             [.architectures[].architecture] == ["amd64", "arm64"]' \
            "${manifest}" >/dev/null

      - name: Bind older-installation migration evidence to the foundation candidate
        env:
          EXPECTED_ARCHIVE_SHA256: ${{ steps.approved_candidate.outputs.image_archive_sha256 }}
          EXPECTED_DESCRIPTOR_SHA256: ${{ steps.approved_candidate.outputs.image_descriptor_sha256 }}
          TAG: ${{ env.RELEASE_TAG }}
        shell: bash
        run: |
          set -euo pipefail
          version="${TAG#v}"
          config_version="$(jq -r '.version' scripts/release/release-config.json)"
          test "${config_version}" = "${version}"
          recovery="$(jq -r '.recovers_unpublished_image_milestone // empty' scripts/release/release-config.json)"
          if [ -z "${recovery}" ]; then
            exit 0
          fi
          fixtures="scripts/release/image-upgrade-baselines.json"
          test "$(jq -r '.candidate_version' "${fixtures}")" = "${version}"
          test "$(jq -r '.recovers_unpublished_image_milestone' "${fixtures}")" = "${recovery}"
          evidence_dir="${RUNNER_TEMP}/native-image-evidence"
          output_dir="dist/update"
          manifest="${output_dir}/channelwatch-image-upgrade-${TAG}-evidence.json"
          python scripts/release/aggregate-image-upgrades.py \
            --evidence-directory "${evidence_dir}" \
            --baselines scripts/release/image-upgrade-baselines.json \
            --descriptor "${RUNNER_TEMP}/approved-candidate/channelwatch-image-${TAG}.json" \
            --candidate-version "${version}" \
            --source-commit "${RELEASE_SHA}" \
            --archive-sha256 "${EXPECTED_ARCHIVE_SHA256}" \
            --descriptor-sha256 "${EXPECTED_DESCRIPTOR_SHA256}" \
            --output "${manifest}"
          logs=()
          for architecture in amd64 arm64; do
            for baseline in 1.4.0 1.4.1; do
              cp "${evidence_dir}/native-image-upgrade-${architecture}-${baseline}.json" \
                "${output_dir}/channelwatch-image-upgrade-${TAG}-${architecture}-${baseline}.json"
              logs+=("native-image-upgrade-${architecture}-${baseline}-logs")
            done
          done
          log_archive="${output_dir}/channelwatch-image-upgrade-${TAG}-logs.tar"
          tar -cf "${log_archive}" -C "${evidence_dir}" "${logs[@]}"
          updated="${RUNNER_TEMP}/image-upgrade-evidence.json"
          jq --arg sha256 "$(sha256sum "${log_archive}" | awk '{print $1}')" \
            '.log_archive_sha256 = $sha256' "${manifest}" > "${updated}"
          mv "${updated}" "${manifest}"

      - name: Set up pinned Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Reject stale release tag
        if: github.event_name == 'push'
        run: >-
          python scripts/release/verify-release-candidate.py
          --tag "${RELEASE_TAG}"
          --sha "${RELEASE_SHA}"
          --main-ref origin/main

      - name: Parse version
        id: version
        shell: bash
        run: |
          raw="${RELEASE_TAG}"
          version="${raw#v}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Verify CHANGELOG entry
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          raw_ref="${RELEASE_TAG}"
          if [[ ! "${raw_ref}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags must use vX.Y.Z format, got ${raw_ref}."
            exit 1
          fi
          version_re="${VERSION//./\\.}"
          if ! grep -Eq "^## \\[${version_re}\\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" docs/releases/CHANGELOG.md; then
            echo "::error::docs/releases/CHANGELOG.md has no release heading for ${VERSION}. Add '## [${VERSION}] - YYYY-MM-DD' before tagging."
            exit 1
          fi

      - name: Install Python release dependencies
        run: |
          python -m pip install --upgrade \
            -c deploy/requirements/runtime.constraints.txt \
            -r deploy/requirements/runtime.txt
          python -m pip install --upgrade \
            -c deploy/requirements/dev.constraints.txt \
            -r deploy/requirements/runtime.txt \
            -r deploy/requirements/dev.txt

      - name: Run Python release gates
        shell: bash
        run: |
          set -euo pipefail
          python scripts/release/release_version_policy.py
          python -m pytest app/core/tests
          python -m compileall app/core app/ui/backend

      - name: Build frontend for app bundle
        working-directory: app/ui
        env:
          CHANNELWATCH_BUILD_ID: ${{ github.sha }}
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm test
          pnpm typecheck
          pnpm build

      - name: Reverify app update frontend on the minimum compatible image
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          delivery_mode="$(jq -r '.delivery_mode' scripts/release/release-config.json)"
          minimum_image_version="$(jq -r '.minimum_image_version' scripts/release/release-config.json)"
          if [ "${delivery_mode}" = "image_required" ]; then
            echo "Skipping the app-update canary for an image-required release."
            exit 0
          fi
          python scripts/release/verify-minimum-image-app-update.py \
            --bundle "dist/update/channelwatch-app-${RELEASE_TAG}.zip" \
            --runtime-bundle "dist/update/channelwatch-runtime-${RELEASE_TAG}-amd64.zip" \
            --runtime-catalog "dist/update/channelwatch-update-catalog-v3.json" \
            --version "${VERSION}" \
            --minimum-image-version "${minimum_image_version}" \
            --image-index-digest "$(jq -r '.minimum_image_sha256' scripts/release/release-config.json)" \
            --evidence-json "${RUNNER_TEMP}/channelwatch-minimum-image-app-update-${RELEASE_TAG}.json"

      - name: Verify generated update assets
        env:
          EXPECTED_CHANNEL: stable
          EXPECTED_GIT_SHA: ${{ env.RELEASE_SHA }}
          EXPECTED_RUNTIME_ABI: channelwatch-runtime-v1
          EXPECTED_SETTINGS_SCHEMA_VERSION: "7"
          RELEASE_SOURCE_ROOT: ${{ github.workspace }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          expected_image_required="$(jq -r '.image_required' scripts/release/release-config.json)"
          expected_delivery_mode="$(jq -r '.delivery_mode' scripts/release/release-config.json)"
          expected_recommended_image_version="$(jq -r '.recommended_image_version' scripts/release/release-config.json)"
          updater_protocol="$(jq -r '.updater_protocol' scripts/release/release-config.json)"
          runtime_generation_required="$(jq -r '.runtime_generation_required // false' scripts/release/release-config.json)"
          if [ "${expected_image_required}" != "true" ] && [ "${expected_image_required}" != "false" ]; then
            echo "::error::release-config.json image_required must be true or false."
            exit 1
          fi
          runtime_verify_args=()
          if [ "${updater_protocol}" = "4" ]; then
            runtime_verify_args=(
              --runtime-catalog "dist/update/channelwatch-update-catalog-v3.json"
              --expected-runtime-source-commit "${EXPECTED_GIT_SHA}"
            )
            if [ "${runtime_generation_required}" = "true" ]; then
              for architecture in amd64 arm64; do
                runtime_verify_args+=(
                  --runtime-bundle "${architecture}=dist/update/channelwatch-runtime-${TAG}-${architecture}.zip"
                  --expected-runtime-bundle-url "${architecture}=https://github.com/CoderLuii/ChannelWatch/releases/download/${TAG}/channelwatch-runtime-${TAG}-${architecture}.zip"
                )
              done
            fi
          fi
          python scripts/release/verify-update-assets.py \
            --release-config scripts/release/release-config.json \
            --manifest "dist/update/channelwatch-update-${TAG}.json" \
            --catalog "dist/update/channelwatch-catalog-${TAG}.json" \
            --bundle "dist/update/channelwatch-app-${TAG}.zip" \
            --expected-version "${VERSION}" \
            --expected-channel "${EXPECTED_CHANNEL}" \
            --expected-runtime-abi "${EXPECTED_RUNTIME_ABI}" \
            --expected-settings-schema-version "${EXPECTED_SETTINGS_SCHEMA_VERSION}" \
            --expected-image-required "${expected_image_required}" \
            --expected-delivery-mode "${expected_delivery_mode}" \
            --expected-recommended-image-version "${expected_recommended_image_version}" \
            --expected-git-sha "${EXPECTED_GIT_SHA}" \
            --expected-release-url "https://github.com/CoderLuii/ChannelWatch/releases/tag/${TAG}" \
            --expected-bundle-url "https://github.com/CoderLuii/ChannelWatch/releases/download/${TAG}/channelwatch-app-${TAG}.zip" \
            "${runtime_verify_args[@]}" \
            --source-root "${RELEASE_SOURCE_ROOT}"

          compatibility_args=()
          if [ "${VERSION}" = "0.9.18" ]; then
            python scripts/release/verify-legacy-update-bridge.py \
              --manifest "dist/update/channelwatch-update-${TAG}.json" \
              --bundle "dist/update/channelwatch-app-${TAG}.zip" \
              --version "${VERSION}"
            compatibility_args=(
              --compatibility-manifest "dist/update/channelwatch-update-${TAG}.json"
              --compatibility-bundle "dist/update/channelwatch-app-${TAG}.zip"
              --historical-image-evidence "${RUNNER_TEMP}/approved-candidate/channelwatch-historical-image-canaries-${TAG}.json"
            )
          else
            python scripts/release/verify-pinned-v1-bridge.py
          fi

          base_ref="$(git tag --sort=-version:refname --merged "${RELEASE_SHA}^" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)"
          if [ -z "${base_ref}" ]; then
            echo "::error::A previous semantic-version release tag is required for impact classification."
            exit 1
          fi
          minimum_image_args=()
          if [ "${expected_delivery_mode}" != "image_required" ]; then
            minimum_image_args=(
              --minimum-image-app-update-evidence "${RUNNER_TEMP}/channelwatch-minimum-image-app-update-${TAG}.json"
              --minimum-image-app-update-bundle "dist/update/channelwatch-app-${TAG}.zip"
            )
          fi
          runtime_policy_args=()
          if [ "${updater_protocol}" = "4" ] && [ "${runtime_generation_required}" = "true" ]; then
            runtime_policy_args=(
              --runtime-catalog "dist/update/channelwatch-update-catalog-v3.json"
              --runtime-capability-evidence "dist/update/channelwatch-runtime-capability-${TAG}.json"
            )
          fi
          python scripts/release/classify-release-impact.py \
            --base-ref "${base_ref}" \
            --target-ref "${RELEASE_SHA}" \
            "${compatibility_args[@]}" \
            "${minimum_image_args[@]}" \
            "${runtime_policy_args[@]}"
          # This tag workflow uses the real runner clock. A future signed
          # publication time must stop the job before even a draft release,
          # immutable image, public release, registry alias, or feed changes.
          python scripts/release/verify-publication-window.py \
            --catalog "dist/update/channelwatch-catalog-${TAG}.json" \
            --version "${VERSION}"

      - name: Verify release VEX
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ env.RELEASE_TAG }}
        run: >-
          python scripts/release/verify-vex.py
          --document "deploy/security/channelwatch-${TAG}.openvex.json"
          --expected-version "${VERSION}"

      - name: Render and validate release body
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ env.RELEASE_TAG }}
        shell: bash
        run: |
          python scripts/release/render-release-body.py \
            --version "${VERSION}" \
            --release-url "https://github.com/CoderLuii/ChannelWatch/releases/tag/${TAG}" \
            --output release-body.md
          first_line="$(head -n 1 release-body.md)"
          expected_heading="$(jq -r '.release_heading' scripts/release/release-config.json)"
          if [ -z "${expected_heading}" ] || [ "${expected_heading}" = "null" ]; then
            echo "::error::release-config.json release_heading is required."
            exit 1
          fi
          if [ "${first_line}" != "${expected_heading}" ]; then
            echo "::error::GitHub Release body must start with '${expected_heading}'."
            exit 1
          fi

      - name: Create or update draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ env.RELEASE_TAG }}
        shell: bash
        run: |
          release_json=""
          if ! release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" 2>/dev/null)"; then
            # gh api writes the JSON 404 body to stdout. Clear it so a missing
            # release is not mistaken for an existing immutable publication.
            release_json=""
          fi
          if [ -n "${release_json}" ] && [ "$(jq -r '.draft' <<<"${release_json}")" != "true" ]; then
            echo "::error::Release ${TAG} is already published and is immutable."
            exit 1
          fi
          release_id="$(jq -r '.id // empty' <<<"${release_json}")"
          if [ -z "${release_id}" ]; then
            release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq ".[] | select(.draft and .tag_name == \"${TAG}\") | .id" | head -n 1)"
          fi
          if [ -n "${release_id}" ]; then
            jq -n \
              --arg tag_name "${TAG}" \
              --arg target_commitish "${RELEASE_SHA}" \
              --arg name "${TAG}" \
              --rawfile body release-body.md \
              '{tag_name: $tag_name, target_commitish: $target_commitish, name: $name, body: $body, prerelease: false}' > release-draft.json
            gh api \
              --method PATCH \
              "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
              --input release-draft.json
          else
            gh release create "${TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${RELEASE_SHA}" \
              --title "${TAG}" \
              --notes-file release-body.md \
              --draft
          fi

      - name: Upload update assets
        id: assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ env.RELEASE_TAG }}
        shell: bash
        run: |
          bundle="dist/update/channelwatch-app-${TAG}.zip"
          manifest="dist/update/channelwatch-update-${TAG}.json"
          catalog="dist/update/channelwatch-catalog-${TAG}.json"
          runtime_catalog="dist/update/channelwatch-update-catalog-v3.json"
          native_evidence="dist/update/channelwatch-native-image-${TAG}-evidence.json"
          vex="deploy/security/channelwatch-${TAG}.openvex.json"
          if [ ! -f "${bundle}" ] || [ ! -f "${manifest}" ] || [ ! -f "${catalog}" ] || [ ! -f "${vex}" ]; then
            echo "::error::Expected update assets were not created."
            exit 1
          fi
          assets=("${bundle}" "${manifest}" "${catalog}" "${vex}")
          legacy_evidence="dist/update/channelwatch-legacy-app-upgrade-${TAG}-evidence.json"
          legacy_logs="dist/update/channelwatch-legacy-app-upgrade-${TAG}-logs.tar"
          test -s "${legacy_evidence}"
          test -s "${legacy_logs}"
          assets+=("${legacy_evidence}" "${legacy_logs}")
          for architecture in amd64 arm64; do
            while IFS= read -r scenario; do
              legacy_receipt="dist/update/channelwatch-legacy-app-upgrade-${TAG}-${architecture}-${scenario}.json"
              test -s "${legacy_receipt}"
              assets+=("${legacy_receipt}")
            done < <(jq -r '.scenarios[].id' scripts/release/legacy-app-upgrade-baselines.json)
          done
          test -s "${native_evidence}"
          assets+=("${native_evidence}")
          recovery="$(jq -r '.recovers_unpublished_image_milestone // empty' scripts/release/release-config.json)"
          if [ -n "${recovery}" ]; then
            fixtures="scripts/release/image-upgrade-baselines.json"
            test "${TAG}" = "v${VERSION}"
            test "$(jq -r '.candidate_version' "${fixtures}")" = "${VERSION}"
            test "$(jq -r '.recovers_unpublished_image_milestone' "${fixtures}")" = "${recovery}"
            upgrade_evidence="dist/update/channelwatch-image-upgrade-${TAG}-evidence.json"
            upgrade_logs="dist/update/channelwatch-image-upgrade-${TAG}-logs.tar"
            test -s "${upgrade_evidence}"
            test -s "${upgrade_logs}"
            assets+=("${upgrade_evidence}" "${upgrade_logs}")
            for architecture in amd64 arm64; do
              for baseline in 1.4.0 1.4.1; do
                upgrade_receipt="dist/update/channelwatch-image-upgrade-${TAG}-${architecture}-${baseline}.json"
                test -s "${upgrade_receipt}"
                assets+=("${upgrade_receipt}")
              done
            done
          fi
          for architecture in amd64 arm64; do
            native_receipt="dist/update/channelwatch-native-image-${TAG}-${architecture}.json"
            native_log="dist/update/channelwatch-native-image-${TAG}-${architecture}.log"
            test -s "${native_receipt}"
            test -f "${native_log}"
            assets+=("${native_receipt}" "${native_log}")
          done
          runtime_catalog_sha=""
          runtime_catalog_url=""
          if [ "$(jq -r '.updater_protocol' scripts/release/release-config.json)" = "4" ]; then
            test -s "${runtime_catalog}"
            assets+=("${runtime_catalog}")
            runtime_catalog_sha="$(sha256sum "${runtime_catalog}" | awk '{print $1}')"
            runtime_catalog_url="https://github.com/CoderLuii/ChannelWatch/releases/download/${TAG}/channelwatch-update-catalog-v3.json"
          fi
          if [ "$(jq -r '.runtime_generation_required // false' scripts/release/release-config.json)" = "true" ]; then
            for architecture in amd64 arm64; do
              runtime_bundle="dist/update/channelwatch-runtime-${TAG}-${architecture}.zip"
              test -s "${runtime_bundle}"
              assets+=("${runtime_bundle}")
            done
            runtime_scan="dist/update/channelwatch-runtime-scan-${TAG}.tar"
            test -s "${runtime_scan}"
            assets+=("${runtime_scan}")
          fi
          gh release upload "${TAG}" "${assets[@]}" --repo "${GITHUB_REPOSITORY}" --clobber
          bundle_sha="$(sha256sum "${bundle}" | awk '{print $1}')"
          catalog_sha="$(sha256sum "${catalog}" | awk '{print $1}')"
          {
            echo "bundle_url=https://github.com/CoderLuii/ChannelWatch/releases/download/${TAG}/channelwatch-app-${TAG}.zip"
            echo "manifest_url=https://github.com/CoderLuii/ChannelWatch/releases/download/${TAG}/channelwatch-update-${TAG}.json"
            echo "catalog_url=https://github.com/CoderLuii/ChannelWatch/releases/download/${TAG}/channelwatch-catalog-${TAG}.json"
            echo "runtime_catalog_url=${runtime_catalog_url}"
            echo "bundle_sha256=${bundle_sha}"
            echo "catalog_sha256=${catalog_sha}"
            echo "runtime_catalog_sha256=${runtime_catalog_sha}"
          } >> "${GITHUB_OUTPUT}"

  build-and-push:
    name: Build and push Docker image
    runs-on: ubuntu-24.04
    needs: build-update-bundle-and-release
    env:
      APPROVED_IMAGE_INDEX_DIGEST: ${{ needs.build-update-bundle-and-release.outputs.approved_image_index_digest }}
    outputs:
      dockerhub_digest: ${{ steps.publish.outputs.dockerhub_digest }}
      ghcr_digest: ${{ steps.publish.outputs.ghcr_digest }}
    permissions:
      contents: write # Read and add verified assets to the exact-SHA draft.
      actions: read # Download the immutable exact-SHA candidate image artifact.
      packages: write # Publish the verified multi-architecture image to GHCR.
      attestations: write # Record provenance for the published image.
      id-token: write # Exchange the workflow identity for the attestation.

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Python for the audited opener
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Download audited opener dependencies
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: runtime-dependencies-amd64-${{ github.sha }}
          path: ${{ runner.temp }}/opener-runtime
      - name: Download the exact approved candidate seal
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build-update-bundle-and-release.outputs.approved_candidate_artifact_id }}
          path: ${{ runner.temp }}/approved-candidate
      - name: Download exact approved candidate image
        env:
          APPROVED_ARCHIVE_SHA256: ${{ needs.build-update-bundle-and-release.outputs.approved_image_archive_sha256 }}
          APPROVED_ARTIFACT_ID: ${{ needs.build-update-bundle-and-release.outputs.approved_candidate_artifact_id }}
          APPROVED_DESCRIPTOR_SHA256: ${{ needs.build-update-bundle-and-release.outputs.approved_image_descriptor_sha256 }}
          APPROVED_IMAGE_INDEX_DIGEST: ${{ needs.build-update-bundle-and-release.outputs.approved_image_index_digest }}
          CHANNELWATCH_UPDATE_SIGNING_KEY: ${{ secrets.CHANNELWATCH_UPDATE_SIGNING_KEY }}
          TAG: ${{ env.RELEASE_TAG }}
        shell: bash
        run: |
          set -euo pipefail
          signing_key="${CHANNELWATCH_UPDATE_SIGNING_KEY}"
          test -n "${signing_key}"
          unset CHANNELWATCH_UPDATE_SIGNING_KEY
          (cd "${RUNNER_TEMP}/opener-runtime" && sha256sum --check channelwatch-runtime-dependencies-amd64.tar.sha256)
          mkdir -p "${RUNNER_TEMP}/opener-dependencies"
          tar -xf "${RUNNER_TEMP}/opener-runtime/channelwatch-runtime-dependencies-amd64.tar" \
            -C "${RUNNER_TEMP}/opener-dependencies"
          export PYTHONPATH="${RUNNER_TEMP}/opener-dependencies/dependencies/site-packages"
          if [[ ! "${APPROVED_ARTIFACT_ID}" =~ ^[0-9]+$ ]] || \
             [[ ! "${APPROVED_IMAGE_INDEX_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]] || \
             [[ ! "${APPROVED_DESCRIPTOR_SHA256}" =~ ^[0-9a-f]{64}$ ]] || \
             [[ ! "${APPROVED_ARCHIVE_SHA256}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Approved candidate image outputs are missing or invalid."
            exit 1
          fi
          approved_dir="${RUNNER_TEMP}/approved-candidate"
          mkdir -p "${approved_dir}" "${RUNNER_TEMP}/channelwatch-release.oci"
          sealed="${approved_dir}/channelwatch-release-candidate-${RELEASE_SHA}.sealed"
          opened="${RUNNER_TEMP}/approved-candidate.tar"
          CHANNELWATCH_UPDATE_SIGNING_KEY="${signing_key}" python scripts/release/seal-candidate-artifact.py open \
            --input "${sealed}" \
            --output "${opened}"
          tar -xf "${opened}" -C "${approved_dir}"
          rm -f "${opened}" "${sealed}"
          (
            cd "${approved_dir}"
            sha256sum --check SHA256SUMS.txt
          )
          descriptor="${approved_dir}/channelwatch-image-${TAG}.json"
          digest="${approved_dir}/channelwatch-image-${TAG}.digest"
          archive="${approved_dir}/channelwatch-image-${TAG}.oci.tar"
          if [ "$(tr -d '\r\n' < "${digest}")" != "${APPROVED_IMAGE_INDEX_DIGEST}" ] || \
             [ "$(sha256sum "${descriptor}" | awk '{print $1}')" != "${APPROVED_DESCRIPTOR_SHA256}" ] || \
             [ "$(sha256sum "${archive}" | awk '{print $1}')" != "${APPROVED_ARCHIVE_SHA256}" ]; then
            echo "::error::Downloaded candidate image does not match the approved exact-SHA outputs."
            exit 1
          fi
          tar -xf "${archive}" -C "${RUNNER_TEMP}/channelwatch-release.oci"
          python scripts/release/describe-oci-image.py \
            --oci-layout "${RUNNER_TEMP}/channelwatch-release.oci" \
            --output "${RUNNER_TEMP}/release-image.json" \
            --digest-output "${RUNNER_TEMP}/release-image.digest"
          cmp --silent "${descriptor}" "${RUNNER_TEMP}/release-image.json"
          cmp --silent "${digest}" "${RUNNER_TEMP}/release-image.digest"
          echo "The exact private candidate image is ready for repeat scanning and publication."

      - name: Parse version
        id: version
        shell: bash
        run: |
          raw="${RELEASE_TAG}"
          version="${raw#v}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Verify CHANGELOG entry
        shell: bash
        run: |
          raw_ref="${RELEASE_TAG}"
          if [[ ! "${raw_ref}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags must use vX.Y.Z format, got ${raw_ref}."
            exit 1
          fi

      - name: Verify CHANGELOG entry
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          version_re="${version//./\\.}"
          if ! grep -Eq "^## \\[${version_re}\\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" docs/releases/CHANGELOG.md; then
            echo "::error::docs/releases/CHANGELOG.md has no release heading for ${version}. Add '## [${version}] - YYYY-MM-DD' before tagging."
            exit 1
          fi

      - name: Free up disk space
        if: runner.environment == 'github-hosted'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo apt-get clean
          docker system prune -af
          df -h

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.75.0
          cache: true

      - name: Scan exact release candidate images
        env:
          OCI_LAYOUT: ${{ runner.temp }}/channelwatch-release.oci
        run: |
          set -euo pipefail
          descriptor="${RUNNER_TEMP}/release-image.json"
          docker pull "${SKOPEO_IMAGE}"
          for platform in linux/amd64 linux/arm64; do
            arch="${platform#linux/}"
            scan_archive="${RUNNER_TEMP}/channelwatch-scan-${arch}.tar"
            docker run --rm --pull=never \
              --volume "${OCI_LAYOUT}:/work/channelwatch.oci:ro" \
              --volume "${RUNNER_TEMP}:/output" \
              "${SKOPEO_IMAGE}" copy \
              --override-os linux \
              --override-arch "${arch}" \
              oci:/work/channelwatch.oci:release-candidate \
              "docker-archive:/output/channelwatch-scan-${arch}.tar:channelwatch-scan-${arch}:exact"
            expected_config_digest="$(jq -er --arg platform "${platform}" \
              '.platforms[] | select(.platform == $platform) | .config.digest' \
              "${descriptor}")"
            config_member="$(tar -xOf "${scan_archive}" manifest.json | jq -er \
              'if type == "array" and length == 1 and .[0].Config then .[0].Config else error("expected one archive manifest entry") end')"
            actual_config_digest="sha256:$(tar -xOf "${scan_archive}" "${config_member}" | sha256sum | awk '{print $1}')"
            config_architecture="$(tar -xOf "${scan_archive}" "${config_member}" | jq -er '.architecture')"
            config_os="$(tar -xOf "${scan_archive}" "${config_member}" | jq -er '.os')"
            if [ "${config_os}" != "linux" ] || [ "${config_architecture}" != "${arch}" ]; then
              echo "::error::Exported scan archive platform does not match ${platform}."
              exit 1
            fi
            if [ "${actual_config_digest}" != "${expected_config_digest}" ]; then
              echo "::error::Exported scan archive config does not match ${platform}."
              exit 1
            fi
            trivy image \
              --input "${scan_archive}" \
              --scanners vuln \
              --severity CRITICAL,HIGH,MEDIUM,LOW \
              --exit-code 0 \
              --format json \
              --output "${RUNNER_TEMP}/channelwatch-upstream-linux-${arch}.json"
            trivy image \
              --input "${scan_archive}" \
              --scanners secret,misconfig \
              --severity CRITICAL,HIGH \
              --exit-code 1
            rm -f "${scan_archive}"
          done

      - name: Retain accepted upstream image vulnerabilities
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upstream-image-release-${{ github.sha }}
          path: ${{ runner.temp }}/channelwatch-upstream-linux-*.json
          retention-days: 30
          if-no-files-found: error

      - name: Install pinned Syft
        id: syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.54.1

      - name: Download and verify existing draft release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ env.RELEASE_TAG }}
        shell: bash
        run: |
          set -euo pipefail
          release_dir="dist/release"
          mkdir -p "${release_dir}"
          # GitHub's release-by-tag endpoint returns 404 for draft releases.
          # Resolve the exact draft from the authenticated release list instead.
          releases_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100")"
          release_json="$(jq -c --arg tag "${TAG}" \
            '[.[] | select(.draft == true and .tag_name == $tag)]' \
            <<<"${releases_json}")"
          if [ "$(jq 'length' <<<"${release_json}")" != "1" ]; then
            echo "::error::Exactly one draft release for ${TAG} is required."
            exit 1
          fi
          release_json="$(jq -c '.[0]' <<<"${release_json}")"
          if [ "$(jq -r '.draft' <<<"${release_json}")" != "true" ] || \
             [ "$(jq -r '.target_commitish' <<<"${release_json}")" != "${RELEASE_SHA}" ]; then
            echo "::error::Signed assets must come from the matching exact-SHA draft release."
            exit 1
          fi
          draft_assets=(
            "channelwatch-app-${TAG}.zip"
            "channelwatch-update-${TAG}.json"
            "channelwatch-catalog-${TAG}.json"
            "channelwatch-${TAG}.openvex.json"
            "channelwatch-native-image-${TAG}-evidence.json"
            "channelwatch-native-image-${TAG}-amd64.json"
            "channelwatch-native-image-${TAG}-amd64.log"
            "channelwatch-native-image-${TAG}-arm64.json"
            "channelwatch-native-image-${TAG}-arm64.log"
            "channelwatch-legacy-app-upgrade-${TAG}-evidence.json"
            "channelwatch-legacy-app-upgrade-${TAG}-logs.tar"
          )
          for architecture in amd64 arm64; do
            while IFS= read -r scenario; do
              draft_assets+=("channelwatch-legacy-app-upgrade-${TAG}-${architecture}-${scenario}.json")
            done < <(jq -r '.scenarios[].id' scripts/release/legacy-app-upgrade-baselines.json)
          done
          if [ "$(jq -r '.updater_protocol' scripts/release/release-config.json)" = "4" ]; then
            draft_assets+=("channelwatch-update-catalog-v3.json")
          fi
          if [ "$(jq -r '.runtime_generation_required // false' scripts/release/release-config.json)" = "true" ]; then
            draft_assets+=(
              "channelwatch-runtime-${TAG}-amd64.zip"
              "channelwatch-runtime-${TAG}-arm64.zip"
              "channelwatch-runtime-scan-${TAG}.tar"
            )
          fi
          recovery="$(jq -r '.recovers_unpublished_image_milestone // empty' scripts/release/release-config.json)"
          if [ -n "${recovery}" ]; then
            version="${TAG#v}"
            config_version="$(jq -r '.version' scripts/release/release-config.json)"
            fixtures="scripts/release/image-upgrade-baselines.json"
            test "${config_version}" = "${version}"
            test "$(jq -r '.candidate_version' "${fixtures}")" = "${version}"
            test "$(jq -r '.recovers_unpublished_image_milestone' "${fixtures}")" = "${recovery}"
            draft_assets+=(
              "channelwatch-image-upgrade-${TAG}-evidence.json"
              "channelwatch-image-upgrade-${TAG}-logs.tar"
            )
            for architecture in amd64 arm64; do
              for baseline in 1.4.0 1.4.1; do
                draft_assets+=("channelwatch-image-upgrade-${TAG}-${architecture}-${baseline}.json")
              done
            done
          fi
          for asset in "${draft_assets[@]}"; do
            gh release download "${TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --pattern "${asset}" \
              --dir "${release_dir}"
            if [ ! -s "${release_dir}/${asset}" ]; then
              echo "::error::Required draft release asset is missing: ${asset}"
              exit 1
            fi
          done

      - name: Generate and verify exact-image license assets
        env:
          OCI_LAYOUT: ${{ runner.temp }}/channelwatch-release.oci
          SYFT_CMD: ${{ steps.syft.outputs.cmd }}
          TAG: ${{ env.RELEASE_TAG }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          release_dir="dist/release"
          mkdir -p "${release_dir}"

          for platform in linux/amd64 linux/arm64; do
            arch="${platform#linux/}"
            spdx="${release_dir}/channelwatch-${TAG}-${arch}.spdx.json"
            cyclonedx="${release_dir}/channelwatch-${TAG}-${arch}.cyclonedx.json"
            "${SYFT_CMD}" scan \
              --platform "${platform}" \
              "oci-dir:${OCI_LAYOUT}" \
              --output "spdx-json=${spdx}" \
              --output "cyclonedx-json=${cyclonedx}"
            jq -e \
              '.spdxVersion == "SPDX-2.3" and
               (.packages | length > 0) and
               any(.packages[]; .name == "zeroconf")' \
              "${spdx}" >/dev/null
            jq -e \
              '.bomFormat == "CycloneDX" and
               (.components | length > 0) and
               any(.components[]; .name == "zeroconf")' \
              "${cyclonedx}" >/dev/null
          done

          cp LICENSE "${release_dir}/channelwatch-${TAG}-LICENSE.txt"
          cp docs/legal/NOTICE "${release_dir}/channelwatch-${TAG}-NOTICE.txt"
          python scripts/release/render_release_legal.py --version "${VERSION}" --source-dir docs/legal --output-dir dist/generated-legal
          cp dist/generated-legal/THIRD_PARTY_LICENSES.md \
            "${release_dir}/channelwatch-${TAG}-THIRD-PARTY-LICENSES.md"
          cp dist/generated-legal/CORRESPONDING_SOURCE.md \
            "${release_dir}/channelwatch-${TAG}-CORRESPONDING-SOURCE.md"
          image_license_root="${RUNNER_TEMP}/channelwatch-image-licenses"
          container_id=""
          cleanup_legal_container() {
            if [ -n "${container_id}" ]; then
              docker rm -f "${container_id}" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup_legal_container EXIT
          docker pull "${SKOPEO_IMAGE}"
          for arch in amd64 arm64; do
            archive_name="channelwatch-legal-${arch}.tar"
            docker run --rm \
              --volume "${OCI_LAYOUT}:/work/channelwatch.oci:ro" \
              --volume "${RUNNER_TEMP}:/output" \
              "${SKOPEO_IMAGE}" copy \
              --override-os linux \
              --override-arch "${arch}" \
              oci:/work/channelwatch.oci:release-candidate \
              "docker-archive:/output/channelwatch-legal-${arch}.tar:channelwatch-legal-${arch}:release"
            docker load --input "${RUNNER_TEMP}/${archive_name}"
            container_id="$(docker create \
              --platform "linux/${arch}" \
              "channelwatch-legal-${arch}:release")"
            architecture_root="${image_license_root}/${arch}"
            mkdir -p \
              "${architecture_root}/usr/share/doc" \
              "${architecture_root}/usr/share/common-licenses"
            docker cp -L "${container_id}:/usr/share/doc/." \
              "${architecture_root}/usr/share/doc"
            docker cp -L "${container_id}:/usr/share/common-licenses/." \
              "${architecture_root}/usr/share/common-licenses"
            docker rm "${container_id}"
            container_id=""
            docker image rm "channelwatch-legal-${arch}:release"
          done
          trap - EXIT
          python scripts/release/copyleft_licenses.py \
            --output-dir "${RUNNER_TEMP}/channelwatch-copyleft-licenses" \
            --source-map dist/generated-legal/CORRESPONDING_SOURCE.md \
            --image-license-root "amd64=${image_license_root}/amd64" \
            --image-license-root "arm64=${image_license_root}/arm64" \
            --archive "${release_dir}/channelwatch-${TAG}-COPYLEFT-LICENSES.zip"

          required_assets=(
            "channelwatch-app-${TAG}.zip"
            "channelwatch-update-${TAG}.json"
            "channelwatch-catalog-${TAG}.json"
            "channelwatch-${TAG}.openvex.json"
            "channelwatch-${TAG}-amd64.spdx.json"
            "channelwatch-${TAG}-amd64.cyclonedx.json"
            "channelwatch-${TAG}-arm64.spdx.json"
            "channelwatch-${TAG}-arm64.cyclonedx.json"
            "channelwatch-${TAG}-LICENSE.txt"
            "channelwatch-${TAG}-NOTICE.txt"
            "channelwatch-${TAG}-THIRD-PARTY-LICENSES.md"
            "channelwatch-${TAG}-CORRESPONDING-SOURCE.md"
            "channelwatch-${TAG}-COPYLEFT-LICENSES.zip"
            "channelwatch-native-image-${TAG}-evidence.json"
            "channelwatch-native-image-${TAG}-amd64.json"
            "channelwatch-native-image-${TAG}-amd64.log"
            "channelwatch-native-image-${TAG}-arm64.json"
            "channelwatch-native-image-${TAG}-arm64.log"
            "channelwatch-legacy-app-upgrade-${TAG}-evidence.json"
            "channelwatch-legacy-app-upgrade-${TAG}-logs.tar"
          )
          for architecture in amd64 arm64; do
            while IFS= read -r scenario; do
              required_assets+=("channelwatch-legacy-app-upgrade-${TAG}-${architecture}-${scenario}.json")
            done < <(jq -r '.scenarios[].id' scripts/release/legacy-app-upgrade-baselines.json)
          done
          if [ "$(jq -r '.updater_protocol' scripts/release/release-config.json)" = "4" ]; then
            required_assets+=("channelwatch-update-catalog-v3.json")
          fi
          if [ "$(jq -r '.runtime_generation_required // false' scripts/release/release-config.json)" = "true" ]; then
            required_assets+=(
              "channelwatch-runtime-${TAG}-amd64.zip"
              "channelwatch-runtime-${TAG}-arm64.zip"
              "channelwatch-runtime-scan-${TAG}.tar"
            )
          fi
          recovery="$(jq -r '.recovers_unpublished_image_milestone // empty' scripts/release/release-config.json)"
          if [ -n "${recovery}" ]; then
            version="${TAG#v}"
            config_version="$(jq -r '.version' scripts/release/release-config.json)"
            fixtures="scripts/release/image-upgrade-baselines.json"
            test "${config_version}" = "${version}"
            test "$(jq -r '.candidate_version' "${fixtures}")" = "${version}"
            test "$(jq -r '.recovers_unpublished_image_milestone' "${fixtures}")" = "${recovery}"
            required_assets+=(
              "channelwatch-image-upgrade-${TAG}-evidence.json"
              "channelwatch-image-upgrade-${TAG}-logs.tar"
            )
            for architecture in amd64 arm64; do
              for baseline in 1.4.0 1.4.1; do
                required_assets+=("channelwatch-image-upgrade-${TAG}-${architecture}-${baseline}.json")
              done
            done
          fi
          for required_asset in "${required_assets[@]}"; do
            if [ ! -s "${release_dir}/${required_asset}" ]; then
              echo "::error::Required checksummed release asset is missing: ${required_asset}"
              exit 1
            fi
          done
          checksum_file="${release_dir}/channelwatch-${TAG}-SHA256SUMS.txt"
          checksum_name="$(basename "${checksum_file}")"
          checksum_tmp="${RUNNER_TEMP}/${checksum_name}"
          (
            cd "${release_dir}"
            find . -maxdepth 1 -type f ! -name "${checksum_name}" \
              -print0 | sort -z | xargs -0 sha256sum > "${checksum_tmp}"
            sha256sum --check "${checksum_tmp}"
          )
          mv "${checksum_tmp}" "${checksum_file}"
          expected_checksum_count="${#required_assets[@]}"
          if [ "$(wc -l < "${checksum_file}" | tr -d ' ')" != "${expected_checksum_count}" ]; then
            echo "::error::Release checksum manifest must cover all ${expected_checksum_count} non-checksum assets."
            exit 1
          fi

      - name: Attach verified license and SBOM assets to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ env.RELEASE_TAG }}
        shell: bash
        run: |
          set -euo pipefail
          releases_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100")"
          release_json="$(jq -c --arg tag "${TAG}" \
            '[.[] | select(.draft == true and .tag_name == $tag)]' \
            <<<"${releases_json}")"
          if [ "$(jq 'length' <<<"${release_json}")" != "1" ]; then
            echo "::error::Exactly one draft release for ${TAG} is required."
            exit 1
          fi
          release_json="$(jq -c '.[0]' <<<"${release_json}")"
          if [ "$(jq -r '.draft' <<<"${release_json}")" != "true" ]; then
            echo "::error::License assets may only be attached to the matching draft release."
            exit 1
          fi
          if [ "$(jq -r '.target_commitish' <<<"${release_json}")" != "${RELEASE_SHA}" ]; then
            echo "::error::Draft release target does not match ${RELEASE_SHA}."
            exit 1
          fi
          gh release upload "${TAG}" dist/release/* \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
          expected_assets="${RUNNER_TEMP}/channelwatch-expected-release-assets.txt"
          actual_assets="${RUNNER_TEMP}/channelwatch-actual-release-assets.txt"
          find dist/release -maxdepth 1 -type f -exec basename {} \; \
            | sort > "${expected_assets}"
          release_id="$(jq -r '.id' <<<"${release_json}")"
          gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
            --jq '.assets[].name' | sort > "${actual_assets}"
          if ! diff -u "${expected_assets}" "${actual_assets}"; then
            echo "::error::Draft release contains an unexpected or missing asset."
            exit 1
          fi

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/docker-auth/.docker
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/docker-auth/.docker
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Publish the scanned images and assemble exact manifests
        id: publish
        env:
          APPROVED_IMAGE_INDEX_DIGEST: ${{ needs.build-update-bundle-and-release.outputs.approved_image_index_digest }}
          DOCKER_CONFIG: ${{ runner.temp }}/docker-auth/.docker
          OCI_LAYOUT: ${{ runner.temp }}/channelwatch-release.oci
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          skopeo_cmd() {
            docker run --rm \
              --volume "${OCI_LAYOUT}:/work/channelwatch.oci:ro" \
              --volume "${DOCKER_CONFIG}:/auth:ro" \
              "${SKOPEO_IMAGE}" "$@"
          }

          root_index="$(cat "${OCI_LAYOUT}/index.json")"
          image_index_digest="$(jq -er '
            if .schemaVersion == 2 and
               (.manifests | length) == 1 and
               .manifests[0].mediaType == "application/vnd.oci.image.index.v1+json" and
               (.manifests[0].digest | test("^sha256:[0-9a-f]{64}$"))
            then .manifests[0].digest
            else error("OCI layout does not reference exactly one nested image index")
            end
          ' <<<"${root_index}")"
          if [ "${image_index_digest}" != "${APPROVED_IMAGE_INDEX_DIGEST}" ]; then
            echo "::error::Exact candidate image index changed before publication."
            exit 1
          fi
          image_index_blob="${OCI_LAYOUT}/blobs/sha256/${image_index_digest#sha256:}"
          if [ ! -f "${image_index_blob}" ]; then
            echo "::error::Scanned OCI layout is missing its nested image-index blob."
            exit 1
          fi
          archive_raw="$(cat "${image_index_blob}")"
          if ! jq -e \
            '.schemaVersion == 2 and
             ([.manifests[] | [.platform.os, .platform.architecture]] | sort) ==
             ([
               ["linux", "amd64"],
               ["linux", "arm64"]
             ] | sort)' <<<"${archive_raw}" >/dev/null; then
            echo "::error::Scanned OCI archive does not contain exactly linux/amd64 and linux/arm64."
            exit 1
          fi

          verify_remote_manifest() {
            repository="$1"
            version_digest="$(skopeo_cmd inspect \
              --authfile /auth/config.json \
              --format '{{.Digest}}' \
              "docker://${repository}:${VERSION}")"
            if [ "${version_digest}" != "${image_index_digest}" ]; then
              echo "::error::${repository}:${VERSION} does not match the immutable approved digest." >&2
              return 1
            fi
            version_raw="$(skopeo_cmd inspect \
              --authfile /auth/config.json \
              --raw \
              "docker://${repository}:${VERSION}")"
            if ! jq -e \
              --argjson archive "${archive_raw}" \
              '(.manifests | sort_by(.digest)) == ($archive.manifests | sort_by(.digest))' \
              <<<"${version_raw}" >/dev/null; then
              echo "::error::Published manifest does not contain the exact scanned platform descriptors."
              return 1
            fi
            printf '%s\n' "${version_digest}"
          }

          preflight_registry() {
            repository="$1"
            tags="$(skopeo_cmd list-tags \
              --authfile /auth/config.json \
              "docker://${repository}")"
            if jq -e --arg version "${VERSION}" '(.Tags // []) | index($version) != null' \
              <<<"${tags}" >/dev/null; then
              verify_remote_manifest "${repository}" >/dev/null || {
                echo "::error::Refusing to overwrite existing immutable tag ${repository}:${VERSION}." >&2
                return 1
              }
              printf 'existing\n'
            else
              printf 'absent\n'
            fi
          }

          publish_registry() {
            repository="$1"
            preflight_state="$2"
            if [ "${preflight_state}" = "absent" ]; then
              skopeo_cmd copy \
                --all \
                --preserve-digests \
                --authfile /auth/config.json \
                oci:/work/channelwatch.oci:release-candidate \
                "docker://${repository}:${VERSION}" >&2
            elif [ "${preflight_state}" != "existing" ]; then
              echo "::error::Invalid immutable-tag preflight state for ${repository}." >&2
              return 1
            fi
            verify_remote_manifest "${repository}"
          }

          # Resolve both immutable version tags before mutating either registry.
          # An existing identical digest is an idempotent retry; any mismatch
          # fails the entire publication before the first copy occurs.
          dockerhub_state="$(preflight_registry "${DOCKERHUB_IMAGE}")"
          ghcr_state="$(preflight_registry "${GHCR_IMAGE}")"
          dockerhub_digest="$(publish_registry "${DOCKERHUB_IMAGE}" "${dockerhub_state}")"
          ghcr_digest="$(publish_registry "${GHCR_IMAGE}" "${ghcr_state}")"
          {
            echo "dockerhub_digest=${dockerhub_digest}"
            echo "ghcr_digest=${ghcr_digest}"
          } >> "${GITHUB_OUTPUT}"

      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/docker-auth/.docker
          HOME: ${{ runner.temp }}/docker-auth
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: index.docker.io/${{ env.DOCKERHUB_IMAGE }}
          subject-digest: ${{ steps.publish.outputs.dockerhub_digest }}
          push-to-registry: true

  update-dockerhub-description:
    name: Update Docker Hub description
    runs-on: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.actor == 'CoderLuii' && vars.CHANNELWATCH_RELEASE_RUNNER || 'ubuntu-latest' }}
    needs: advance-compatible-aliases
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKERHUB_IMAGE }}
          readme-filepath: docs/dockerhub-description.md

  publish-github-release:
    name: Publish GitHub Release
    runs-on: ubuntu-24.04
    needs:
      - build-update-bundle-and-release
      - build-and-push
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write # Promote the exact-SHA draft to the public GitHub release.

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Download audited opener dependencies
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: runtime-dependencies-amd64-${{ github.sha }}
          path: ${{ runner.temp }}/opener-runtime
      - name: Download the exact approved candidate seal
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build-update-bundle-and-release.outputs.approved_candidate_artifact_id }}
          path: ${{ runner.temp }}/approved-candidate-canary

      - name: Open candidate before publication verification starts
        env:
          APPROVED_ARTIFACT_ID: ${{ needs.build-update-bundle-and-release.outputs.approved_candidate_artifact_id }}
          CHANNELWATCH_UPDATE_SIGNING_KEY: ${{ secrets.CHANNELWATCH_UPDATE_SIGNING_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          signing_key="${CHANNELWATCH_UPDATE_SIGNING_KEY}"
          test -n "${signing_key}"
          unset CHANNELWATCH_UPDATE_SIGNING_KEY
          (cd "${RUNNER_TEMP}/opener-runtime" && sha256sum --check channelwatch-runtime-dependencies-amd64.tar.sha256)
          mkdir -p "${RUNNER_TEMP}/opener-dependencies"
          tar -xf "${RUNNER_TEMP}/opener-runtime/channelwatch-runtime-dependencies-amd64.tar" \
            -C "${RUNNER_TEMP}/opener-dependencies"
          export PYTHONPATH="${RUNNER_TEMP}/opener-dependencies/dependencies/site-packages"
          approved_dir="${RUNNER_TEMP}/approved-candidate-canary"
          mkdir -p "${approved_dir}"
          CHANNELWATCH_UPDATE_SIGNING_KEY="${signing_key}" python scripts/release/seal-candidate-artifact.py open \
            --input "${approved_dir}/channelwatch-release-candidate-${RELEASE_SHA}.sealed" \
            --output "${RUNNER_TEMP}/approved-candidate-canary.tar"
          tar -xf "${RUNNER_TEMP}/approved-candidate-canary.tar" -C "${approved_dir}"
          rm -f "${RUNNER_TEMP}/approved-candidate-canary.tar" "${approved_dir}"/*.sealed
          (cd "${approved_dir}" && sha256sum --check SHA256SUMS.txt)

      - name: Parse version
        id: version
        shell: bash
        run: |
          raw="${RELEASE_TAG}"
          version="${raw#v}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Install update verifier dependencies
        run: |
          python -m pip install --upgrade \
            -c deploy/requirements/runtime.constraints.txt \
            -r deploy/requirements/runtime.txt

      - name: Render release body
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ env.RELEASE_TAG }}
        shell: bash
        run: |
          python scripts/release/render-release-body.py \
            --version "${VERSION}" \
            --release-url "https://github.com/CoderLuii/ChannelWatch/releases/tag/${TAG}" \
            --output release-body.md

      - name: Verify pinned bridge or rerun v0.9.18 historical canaries
        env:
          APPROVED_IMAGE_INDEX_DIGEST: ${{ needs.build-update-bundle-and-release.outputs.approved_image_index_digest }}
          TAG: ${{ env.RELEASE_TAG }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${VERSION}" != "0.9.18" ]; then
            python scripts/release/verify-pinned-v1-bridge.py
            exit 0
          fi
          approved_dir="${RUNNER_TEMP}/approved-candidate-canary"
          python scripts/release/verify-historical-image-canaries.py \
            --manifest "${approved_dir}/channelwatch-update-${TAG}.json" \
            --bundle "${approved_dir}/channelwatch-app-${TAG}.zip" \
            --version "${VERSION}" \
            --recovery-image "${DOCKERHUB_IMAGE}@${APPROVED_IMAGE_INDEX_DIGEST}" \
            --evidence-json "${RUNNER_TEMP}/tag-historical-image-canaries.json"
          python - "${approved_dir}/channelwatch-historical-image-canaries-${TAG}.json" "${RUNNER_TEMP}/tag-historical-image-canaries.json" "${VERSION}" <<'PY'
          import json
          import re
          import sys

          approved_path, repeated_path, expected_version = sys.argv[1:]
          with open(approved_path, encoding="utf-8") as handle:
              approved = json.load(handle)
          with open(repeated_path, encoding="utf-8") as handle:
              repeated = json.load(handle)

          expected_keys = {
              *(f'activation_success:0.9.{patch}' for patch in range(11, 18)),
              'activation_failure:0.9.15:ui',
              'activation_failure:0.9.17:core',
              'tamper_rejection:0.9.15:manifest',
              'tamper_rejection:0.9.15:bundle',
              'tamper_rejection:0.9.17:manifest',
              'tamper_rejection:0.9.17:bundle',
              'image_refresh_recovery:0.9.9',
              'image_refresh_recovery:0.9.10',
          }

          def fail(label, message):
              raise SystemExit(f"{label} historical canary evidence is invalid: {message}")

          def row_key(row, label):
              scenario = row.get("scenario")
              source_version = row.get("source_version")
              scenario_id = row.get("scenario_key")
              if not all(isinstance(value, str) and value for value in (
                  scenario, source_version, scenario_id
              )):
                  fail(label, "every result row must have scenario, scenario_key, and source_version")
              variant = (
                  row.get("failed_component") if scenario == "activation_failure"
                  else row.get("tamper_case") if scenario == "tamper_rejection"
                  else None
              )
              expected_id = ":".join(
                  str(value) for value in (scenario, source_version, variant) if value
              )
              if scenario_id != expected_id:
                  fail(label, f"scenario key {scenario_id!r} does not match {expected_id!r}")
              return scenario_id

          def require_fields(row, fields, key, label):
              missing = sorted(fields - row.keys())
              if missing:
                  fail(label, f"{key} is missing fields: {missing}")

          def require_exact(row, expected, key, label):
              for field, value in expected.items():
                  if row.get(field) != value:
                      fail(label, f"{key} has {field}={row.get(field)!r}, expected {value!r}")

          def normalized(document, label):
              if document.get("schema") != 2:
                  fail(label, "schema must be exactly 2")
              if document.get("target_version") != expected_version:
                  fail(label, "target_version does not match the tag")
              if document.get("platform") != "linux/amd64":
                  fail(label, "platform must be linux/amd64")
              if document.get("passed") is not True:
                  fail(label, "top-level passed must be true")
              results = document.get("results")
              if not isinstance(results, list):
                  fail(label, "results must be a list")

              keyed = {}
              for raw_row in results:
                  if not isinstance(raw_row, dict):
                      fail(label, "every result must be an object")
                  row = dict(raw_row)
                  key = row_key(row, label)
                  if key in keyed:
                      fail(label, f"duplicate scenario row {key}")
                  keyed[key] = row

              actual_keys = set(keyed)
              if actual_keys != expected_keys:
                  fail(
                      label,
                      f"scenario rows differ; missing={sorted(expected_keys - actual_keys)}, "
                      f"unexpected={sorted(actual_keys - expected_keys)}",
                  )

              sha40 = re.compile(r"[0-9a-f]{40}\Z")
              sha64 = re.compile(r"[0-9a-f]{64}\Z")
              digest64 = re.compile(r"sha256:[0-9a-f]{64}\Z")
              bundle_digests = set()
              for key, row in keyed.items():
                  scenario = row["scenario"]
                  source_version = row["source_version"]
                  failed_component = row.get("failed_component")
                  tamper_case = row.get("tamper_case")
                  expected_protocol = 0 if source_version == "0.9.9" else 1 if source_version <= "0.9.15" else 2
                  if row.get("launcher_protocol") != expected_protocol:
                      fail(label, f"{key} has an incorrect launcher protocol")

                  if scenario == "activation_success":
                      require_fields(row, {
                          "source_sha", "image_index_digest", "amd64_digest", "bundle_sha256",
                          "check_status", "apply_status", "final_job_status", "core_bundle",
                          "ui_bundle", "portal_api_verified", "restart_count_delta",
                          "supervisor_stable", "rollback_target_verified",
                          "active_identity_verified", "managed_key_verified",
                          "stale_control_file_count", "result",
                      }, key, label)
                      require_exact(row, {
                          "check_status": "available", "final_job_status": "success",
                          "core_bundle": True, "ui_bundle": True, "portal_api_verified": True,
                          "supervisor_stable": True, "rollback_target_verified": True,
                          "active_identity_verified": True, "managed_key_verified": True,
                          "stale_control_file_count": 0, "result": "passed",
                      }, key, label)
                      if not isinstance(row.get("apply_status"), str) or not row["apply_status"]:
                          fail(label, f"{key} has no apply status")
                      if type(row.get("restart_count_delta")) is not int or row["restart_count_delta"] < 1:
                          fail(label, f"{key} has an invalid restart delta")
                  elif scenario == "activation_failure":
                      require_fields(row, {
                          "failed_component", "bundle_sha256", "portal_api_verified",
                          "restart_count_delta", "final_job_status", "rollback_applied",
                          "failed_identity_quarantined", "image_runtime_restored",
                          "supervisor_stable", "stale_control_file_count", "result",
                      }, key, label)
                      require_exact(row, {
                          "failed_component": failed_component, "portal_api_verified": True,
                          "final_job_status": "failed", "rollback_applied": True,
                          "failed_identity_quarantined": True, "image_runtime_restored": True,
                          "supervisor_stable": True, "stale_control_file_count": 0,
                          "result": "passed",
                      }, key, label)
                      if type(row.get("restart_count_delta")) is not int or row["restart_count_delta"] < 1:
                          fail(label, f"{key} has an invalid restart delta")
                  elif scenario == "tamper_rejection":
                      require_fields(row, {
                          "tamper_case", "rejected_before_selection", "active_unchanged",
                          "restart_count_delta", "result",
                      }, key, label)
                      require_exact(row, {
                          "tamper_case": tamper_case, "rejected_before_selection": True,
                          "active_unchanged": True, "restart_count_delta": 0,
                          "result": "passed",
                      }, key, label)
                  elif scenario == "image_refresh_recovery":
                      require_fields(row, {
                          "source_sha", "image_index_digest", "amd64_digest", "bundle_sha256",
                          "check_status", "apply_status", "image_refresh_required",
                          "recovery_job_status", "recovery_quorum_verified",
                          "recovery_image_runtime_verified", "managed_key_verified",
                          "supervisor_stable", "stale_control_file_count", "result",
                      }, key, label)
                      require_exact(row, {
                          "check_status": "available",
                          "image_refresh_required": True,
                          "recovery_job_status": "success", "recovery_quorum_verified": True,
                          "recovery_image_runtime_verified": True, "managed_key_verified": True,
                          "supervisor_stable": True, "stale_control_file_count": 0,
                          "result": "passed_with_documented_image_only_limitation",
                      }, key, label)
                      if not isinstance(row.get("apply_status"), str) or not row["apply_status"]:
                          fail(label, f"{key} has no apply status")
                      if source_version == "0.9.9":
                          require_exact(row, {
                              "immutable_false_success_observed": True,
                              "legacy_core_launcher_failure_observed": True,
                              "legacy_ui_image_runtime_verified": True,
                              "recovery_image_cleared_false_success": True,
                          }, key, label)
                      else:
                          require_exact(row, {
                              "portal_api_verified": True,
                              "immutable_entrypoint_failure_observed": True,
                              "legacy_restart_loop_observed": True,
                              "legacy_restart_count_at_least": 2,
                              "legacy_staged_identity_preserved": True,
                              "recovery_image_cleared_failed_activation": True,
                          }, key, label)
                  else:
                      fail(label, f"{key} has an unsupported scenario {scenario!r}")

                  if scenario in {"activation_success", "image_refresh_recovery"}:
                      if not sha40.fullmatch(str(row.get("source_sha", ""))):
                          fail(label, f"{key} has an invalid source SHA")
                      if not digest64.fullmatch(str(row.get("image_index_digest", ""))):
                          fail(label, f"{key} has an invalid image index digest")
                      if not digest64.fullmatch(str(row.get("amd64_digest", ""))):
                          fail(label, f"{key} has an invalid amd64 digest")
                  if "bundle_sha256" in row:
                      if not sha64.fullmatch(str(row["bundle_sha256"])):
                          fail(label, f"{key} has an invalid bundle digest")
                      bundle_digests.add(row["bundle_sha256"])

              if len(bundle_digests) != 1:
                  fail(label, "all applicable rows must attest the same bundle digest")

              normalized_rows = []
              for key in sorted(keyed):
                  # Docker's absolute RestartCount depends on the runner. The
                  # per-scenario restart_count_delta remains release evidence.
                  normalized_rows.append({
                      field: value
                      for field, value in sorted(keyed[key].items())
                      if field != "restart_count"
                  })
              normalized_document = {
                  field: value
                  for field, value in sorted(document.items())
                  if field != "results"
              }
              normalized_document["results"] = normalized_rows
              return normalized_document

          approved_normalized = normalized(approved, "approved candidate")
          repeated_normalized = normalized(repeated, "tag rerun")
          if approved_normalized != repeated_normalized:
              raise SystemExit(
                  "tag historical canary does not semantically reproduce approved evidence"
              )
          PY

      - name: Publish release after image verification gates
        env:
          EXPECTED_CATALOG_SHA256: ${{ needs.build-update-bundle-and-release.outputs.catalog_sha256 }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ env.RELEASE_TAG }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          releases_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100")"
          release_json="$(jq -c --arg tag "${TAG}" \
            '[.[] | select(.draft == true and .tag_name == $tag)]' \
            <<<"${releases_json}")"
          if [ "$(jq 'length' <<<"${release_json}")" != "1" ]; then
            echo "::error::Draft release for ${TAG} is missing or already published; published releases are immutable."
            exit 1
          fi
          release_json="$(jq -c '.[0]' <<<"${release_json}")"
          if [ "$(jq -r '.tag_name' <<<"${release_json}")" != "${TAG}" ] || [ "$(jq -r '.target_commitish' <<<"${release_json}")" != "${RELEASE_SHA}" ]; then
            echo "::error::Draft release identity does not match ${TAG} at ${RELEASE_SHA}."
            exit 1
          fi
          release_id="$(jq -r '.id // empty' <<<"${release_json}")"
          if [ -z "${release_id}" ]; then
            echo "::error::Draft release for ${TAG} was not found."
            exit 1
          fi
          catalog_name="channelwatch-catalog-${TAG}.json"
          catalog_asset_ids="$(jq -r --arg name "${catalog_name}" \
            '.assets[] | select(.name == $name) | .id' <<<"${release_json}")"
          if [ "$(wc -w <<<"${catalog_asset_ids}" | tr -d ' ')" != "1" ]; then
            echo "::error::Draft release must contain exactly one approved update catalog."
            exit 1
          fi
          catalog_path="${RUNNER_TEMP}/${catalog_name}"
          gh api \
            -H 'Accept: application/octet-stream' \
            "repos/${GITHUB_REPOSITORY}/releases/assets/${catalog_asset_ids}" \
            > "${catalog_path}"
          if [ "$(sha256sum "${catalog_path}" | awk '{print $1}')" != "${EXPECTED_CATALOG_SHA256}" ]; then
            echo "::error::Draft catalog does not match the exact approved candidate."
            exit 1
          fi
          python scripts/release/verify-publication-window.py \
            --catalog "${catalog_path}" \
            --version "${VERSION}"
          jq -n \
            --arg name "${TAG}" \
            --rawfile body release-body.md \
            '{name: $name, body: $body, draft: false, prerelease: false}' > publish-release.json
          gh api \
            --method PATCH \
            "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
            --input publish-release.json

  verify-public-release-assets:
    name: Verify public release assets before stable feeds
    runs-on: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.actor == 'CoderLuii' && vars.CHANNELWATCH_RELEASE_RUNNER || 'ubuntu-latest' }}
    needs:
      - build-update-bundle-and-release
      - build-and-push
      - publish-github-release
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read

    steps:
      - name: Checkout exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Install update verifier dependencies
        run: |
          python -m pip install --upgrade \
            -c deploy/requirements/runtime.constraints.txt \
            -r deploy/requirements/runtime.txt

      - name: Verify public release identity and asset inventory
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ env.RELEASE_TAG }}
        shell: bash
        run: |
          set -euo pipefail
          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}")"
          if [ "$(jq -r '.tag_name' <<<"${release_json}")" != "${TAG}" ] || \
             [ "$(jq -r '.name' <<<"${release_json}")" != "${TAG}" ] || \
             [ "$(jq -r '.target_commitish' <<<"${release_json}")" != "${RELEASE_SHA}" ] || \
             [ "$(jq -r '.draft' <<<"${release_json}")" != "false" ] || \
             [ "$(jq -r '.prerelease' <<<"${release_json}")" != "false" ]; then
            echo "::error::Public GitHub release identity does not match the exact reviewed tag and SHA."
            exit 1
          fi
          expected_heading="$(jq -r '.release_heading' scripts/release/release-config.json)"
          actual_heading="$(jq -r '.body' <<<"${release_json}" | sed -n '1p')"
          if [ "${actual_heading}" != "${expected_heading}" ]; then
            echo "::error::Public release body heading does not match release configuration."
            exit 1
          fi

          tag="${TAG}"
          expected_assets="${RUNNER_TEMP}/expected-public-assets.txt"
          actual_assets="${RUNNER_TEMP}/actual-public-assets.txt"
          printf '%s\n' \
            "channelwatch-app-${tag}.zip" \
            "channelwatch-catalog-${tag}.json" \
            "channelwatch-update-${tag}.json" \
            "channelwatch-${tag}.openvex.json" \
            "channelwatch-${tag}-amd64.spdx.json" \
            "channelwatch-${tag}-amd64.cyclonedx.json" \
            "channelwatch-${tag}-arm64.spdx.json" \
            "channelwatch-${tag}-arm64.cyclonedx.json" \
            "channelwatch-${tag}-LICENSE.txt" \
            "channelwatch-${tag}-NOTICE.txt" \
            "channelwatch-${tag}-THIRD-PARTY-LICENSES.md" \
            "channelwatch-${tag}-CORRESPONDING-SOURCE.md" \
            "channelwatch-${tag}-COPYLEFT-LICENSES.zip" \
            "channelwatch-native-image-${tag}-evidence.json" \
            "channelwatch-native-image-${tag}-amd64.json" \
            "channelwatch-native-image-${tag}-amd64.log" \
            "channelwatch-native-image-${tag}-arm64.json" \
            "channelwatch-native-image-${tag}-arm64.log" \
            "channelwatch-legacy-app-upgrade-${tag}-evidence.json" \
            "channelwatch-legacy-app-upgrade-${tag}-logs.tar" \
            "channelwatch-${tag}-SHA256SUMS.txt" \
            | sort > "${expected_assets}"
          for architecture in amd64 arm64; do
            while IFS= read -r scenario; do
              echo "channelwatch-legacy-app-upgrade-${tag}-${architecture}-${scenario}.json" >> "${expected_assets}"
            done < <(jq -r '.scenarios[].id' scripts/release/legacy-app-upgrade-baselines.json)
          done
          if [ "$(jq -r '.updater_protocol' scripts/release/release-config.json)" = "4" ]; then
            echo "channelwatch-update-catalog-v3.json" >> "${expected_assets}"
          fi
          if [ "$(jq -r '.runtime_generation_required // false' scripts/release/release-config.json)" = "true" ]; then
            printf '%s\n' \
              "channelwatch-runtime-${tag}-amd64.zip" \
              "channelwatch-runtime-${tag}-arm64.zip" \
              "channelwatch-runtime-scan-${tag}.tar" \
              >> "${expected_assets}"
          fi
          recovery="$(jq -r '.recovers_unpublished_image_milestone // empty' scripts/release/release-config.json)"
          if [ -n "${recovery}" ]; then
            version="${tag#v}"
            config_version="$(jq -r '.version' scripts/release/release-config.json)"
            fixtures="scripts/release/image-upgrade-baselines.json"
            test "${config_version}" = "${version}"
            test "$(jq -r '.candidate_version' "${fixtures}")" = "${version}"
            test "$(jq -r '.recovers_unpublished_image_milestone' "${fixtures}")" = "${recovery}"
            printf '%s\n' \
              "channelwatch-image-upgrade-${tag}-evidence.json" \
              "channelwatch-image-upgrade-${tag}-logs.tar" \
              >> "${expected_assets}"
            for architecture in amd64 arm64; do
              for baseline in 1.4.0 1.4.1; do
                echo "channelwatch-image-upgrade-${tag}-${architecture}-${baseline}.json" >> "${expected_assets}"
              done
            done
          fi
          sort -o "${expected_assets}" "${expected_assets}"
          jq -r '.assets[].name' <<<"${release_json}" | sort > "${actual_assets}"
          if ! diff -u "${expected_assets}" "${actual_assets}"; then
            echo "::error::Public release has an unexpected or missing asset."
            exit 1
          fi

      - name: Download and verify public release assets
        env:
          DOCKERHUB_DIGEST: ${{ needs.build-and-push.outputs.dockerhub_digest }}
          EXPECTED_BUNDLE_SHA256: ${{ needs.build-update-bundle-and-release.outputs.bundle_sha256 }}
          EXPECTED_CATALOG_SHA256: ${{ needs.build-update-bundle-and-release.outputs.catalog_sha256 }}
          TAG: ${{ env.RELEASE_TAG }}
        shell: bash
        run: |
          set -euo pipefail
          version="${TAG#v}"
          public_dir="dist/public-release"
          mkdir -p "${public_dir}"

          download_public_asset() {
            asset="$1"
            curl --fail --silent --show-error --location \
              --proto '=https' --tlsv1.2 \
              --connect-timeout 20 --max-time 180 \
              --retry 12 --retry-all-errors --retry-delay 5 --retry-max-time 360 \
              --output "${public_dir}/${asset}" \
              "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${asset}"
            test -s "${public_dir}/${asset}"
          }

          while IFS= read -r asset; do
            download_public_asset "${asset}"
          done < "${RUNNER_TEMP}/expected-public-assets.txt"

          checksum_file="channelwatch-${TAG}-SHA256SUMS.txt"
          expected_checksum_count=32
          if [ "$(jq -r '.updater_protocol' scripts/release/release-config.json)" = "4" ]; then
            expected_checksum_count=$((expected_checksum_count + 1))
          fi
          if [ "$(jq -r '.runtime_generation_required // false' scripts/release/release-config.json)" = "true" ]; then
            expected_checksum_count=$((expected_checksum_count + 3))
          fi
          if [ -n "$(jq -r '.recovers_unpublished_image_milestone // empty' scripts/release/release-config.json)" ]; then
            expected_checksum_count=$((expected_checksum_count + 6))
          fi
          if [ "$(wc -l < "${public_dir}/${checksum_file}" | tr -d ' ')" != "${expected_checksum_count}" ]; then
            echo "::error::Public checksum manifest must cover all ${expected_checksum_count} non-checksum assets."
            exit 1
          fi
          (
            cd "${public_dir}"
            sha256sum --check "${checksum_file}"
          )

          bundle="${public_dir}/channelwatch-app-${TAG}.zip"
          manifest="${public_dir}/channelwatch-update-${TAG}.json"
          catalog="${public_dir}/channelwatch-catalog-${TAG}.json"
          if [ "$(sha256sum "${bundle}" | awk '{print $1}')" != "${EXPECTED_BUNDLE_SHA256}" ] || \
             [ "$(sha256sum "${catalog}" | awk '{print $1}')" != "${EXPECTED_CATALOG_SHA256}" ]; then
            echo "::error::Public update assets do not match the approved exact-SHA build outputs."
            exit 1
          fi

          image_required="$(jq -r '.image_required' scripts/release/release-config.json)"
          delivery_mode="$(jq -r '.delivery_mode' scripts/release/release-config.json)"
          recommended_image="$(jq -r '.recommended_image_version' scripts/release/release-config.json)"
          updater_protocol="$(jq -r '.updater_protocol' scripts/release/release-config.json)"
          runtime_generation_required="$(jq -r '.runtime_generation_required // false' scripts/release/release-config.json)"
          runtime_verify_args=()
          if [ "${updater_protocol}" = "4" ]; then
            runtime_verify_args=(
              --runtime-catalog "${public_dir}/channelwatch-update-catalog-v3.json"
              --expected-runtime-source-commit "${RELEASE_SHA}"
            )
            if [ "${runtime_generation_required}" = "true" ]; then
              for architecture in amd64 arm64; do
                runtime_verify_args+=(
                  --runtime-bundle "${architecture}=${public_dir}/channelwatch-runtime-${TAG}-${architecture}.zip"
                  --expected-runtime-bundle-url "${architecture}=https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/channelwatch-runtime-${TAG}-${architecture}.zip"
                )
              done
            fi
          fi
          python scripts/release/verify-update-assets.py \
            --release-config scripts/release/release-config.json \
            --manifest "${manifest}" \
            --catalog "${catalog}" \
            --bundle "${bundle}" \
            --expected-version "${version}" \
            --expected-channel stable \
            --expected-runtime-abi channelwatch-runtime-v1 \
            --expected-settings-schema-version 7 \
            --expected-image-required "${image_required}" \
            --expected-delivery-mode "${delivery_mode}" \
            --expected-recommended-image-version "${recommended_image}" \
            --expected-git-sha "${RELEASE_SHA}" \
            --expected-release-url "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}" \
            --expected-bundle-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/channelwatch-app-${TAG}.zip" \
            "${runtime_verify_args[@]}" \
            --source-root "${GITHUB_WORKSPACE}"
          if [ "${version}" = "0.9.18" ]; then
            python scripts/release/verify-legacy-update-bridge.py \
              --manifest "${manifest}" \
              --bundle "${bundle}" \
              --version "${version}"
            python scripts/release/verify-historical-image-canaries.py \
              --manifest "${manifest}" \
              --bundle "${bundle}" \
              --version "${version}" \
              --version-source 0.9.10 \
              --version-source 0.9.15 \
              --version-source 0.9.16 \
              --version-source 0.9.17 \
              --recovery-image "${DOCKERHUB_IMAGE}@${DOCKERHUB_DIGEST}" \
              --evidence-json "${RUNNER_TEMP}/public-historical-image-canaries.json"
          else
            python scripts/release/verify-pinned-v1-bridge.py
          fi
          python scripts/release/verify-publication-window.py \
            --catalog "${catalog}" \
            --version "${version}"
          python scripts/release/verify-vex.py \
            --document "${public_dir}/channelwatch-${TAG}.openvex.json" \
            --expected-version "${version}"

          for arch in amd64 arm64; do
            jq -e '.spdxVersion == "SPDX-2.3" and (.packages | length > 0)' \
              "${public_dir}/channelwatch-${TAG}-${arch}.spdx.json" >/dev/null
            jq -e '.bomFormat == "CycloneDX" and (.components | length > 0)' \
              "${public_dir}/channelwatch-${TAG}-${arch}.cyclonedx.json" >/dev/null
          done
          unzip -t "${public_dir}/channelwatch-${TAG}-COPYLEFT-LICENSES.zip" >/dev/null
          for asset in \
            "channelwatch-${TAG}-LICENSE.txt" \
            "channelwatch-${TAG}-NOTICE.txt" \
            "channelwatch-${TAG}-THIRD-PARTY-LICENSES.md" \
            "channelwatch-${TAG}-CORRESPONDING-SOURCE.md"; do
            test -s "${public_dir}/${asset}"
          done

  sync-site:
    name: Sync website release metadata
    runs-on: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.actor == 'CoderLuii' && vars.CHANNELWATCH_RELEASE_RUNNER || 'ubuntu-latest' }}
    needs:
      - build-update-bundle-and-release
      - build-and-push
      - publish-github-release
      - verify-public-release-assets
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false

      - name: Parse version
        id: version
        shell: bash
        run: |
          raw="${RELEASE_TAG}"
          version="${raw#v}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Verify publication window before stable-feed dispatch
        env:
          EXPECTED_CATALOG_SHA256: ${{ needs.build-update-bundle-and-release.outputs.catalog_sha256 }}
          UPDATE_CATALOG_URL: ${{ needs.build-update-bundle-and-release.outputs.catalog_url }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          catalog_path="${RUNNER_TEMP}/channelwatch-publication-catalog.json"
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            --max-time 120 \
            --output "${catalog_path}" \
            "${UPDATE_CATALOG_URL}"
          if [ "$(sha256sum "${catalog_path}" | awk '{print $1}')" != "${EXPECTED_CATALOG_SHA256}" ]; then
            echo "::error::Public release catalog does not match the exact approved candidate."
            exit 1
          fi
          python scripts/release/verify-publication-window.py \
            --catalog "${catalog_path}" \
            --version "${VERSION}"

      - name: Dispatch website sync
        env:
          GH_TOKEN: ${{ secrets.SITE_SYNC_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ env.RELEASE_TAG }}
          SOURCE_SHA: ${{ env.RELEASE_SHA }}
          SOURCE_REPO: ${{ github.repository }}
          UPDATE_BUNDLE_URL: ${{ needs.build-update-bundle-and-release.outputs.bundle_url }}
          UPDATE_MANIFEST_URL: ${{ needs.build-update-bundle-and-release.outputs.manifest_url }}
          UPDATE_CATALOG_URL: ${{ needs.build-update-bundle-and-release.outputs.catalog_url }}
          RUNTIME_UPDATE_CATALOG_URL: ${{ needs.build-update-bundle-and-release.outputs.runtime_catalog_url }}
          UPDATE_BUNDLE_SHA256: ${{ needs.build-update-bundle-and-release.outputs.bundle_sha256 }}
        shell: bash
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::SITE_SYNC_TOKEN is required to dispatch the website sync workflow."
            exit 1
          fi

          # The schema-1 stable feed is a permanent v0.9.18 bridge. Future
          # releases advance only the schema-2 catalog and must not offer a new
          # manifest for the site to copy over the bridge.
          stable_manifest_url=""
          if [ "${VERSION}" = "0.9.18" ]; then
            stable_manifest_url="${UPDATE_MANIFEST_URL}"
          fi

          jq -n \
            --arg version "${VERSION}" \
            --arg tag "${TAG}" \
            --arg sha "${SOURCE_SHA}" \
            --arg release_url "https://github.com/CoderLuii/ChannelWatch/releases/tag/${TAG}" \
            --arg source_repo "${SOURCE_REPO}" \
            --arg update_bundle_url "${UPDATE_BUNDLE_URL}" \
            --arg update_manifest_url "${stable_manifest_url}" \
            --arg update_catalog_url "${UPDATE_CATALOG_URL}" \
            --arg runtime_update_catalog_url "${RUNTIME_UPDATE_CATALOG_URL}" \
            --arg update_bundle_sha256 "${UPDATE_BUNDLE_SHA256}" \
            '{
              event_type: "channelwatch-release",
              client_payload: {
                version: $version,
                tag: $tag,
                sha: $sha,
                release_url: $release_url,
                source_repo: $source_repo,
                update_bundle_url: $update_bundle_url,
                update_manifest_url: $update_manifest_url,
                update_catalog_url: $update_catalog_url,
                runtime_update_catalog_url: $runtime_update_catalog_url,
                update_bundle_sha256: $update_bundle_sha256
              }
            }' > site-sync-dispatch.json

          gh api \
            --method POST \
            repos/CoderLuii/ChannelWatch-site/dispatches \
            --input site-sync-dispatch.json

  verify-live-update-manifest:
    name: Verify live stable update manifest
    runs-on: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.actor == 'CoderLuii' && vars.CHANNELWATCH_RELEASE_RUNNER || 'ubuntu-latest' }}
    needs:
      - build-update-bundle-and-release
      - sync-site
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Parse release configuration
        id: release
        shell: bash
        run: |
          {
            echo "version=${RELEASE_TAG#v}"
            echo "image_required=$(jq -r '.image_required' scripts/release/release-config.json)"
            echo "delivery_mode=$(jq -r '.delivery_mode' scripts/release/release-config.json)"
            echo "recommended_image_version=$(jq -r '.recommended_image_version' scripts/release/release-config.json)"
            echo "updater_protocol=$(jq -r '.updater_protocol' scripts/release/release-config.json)"
          } >> "${GITHUB_OUTPUT}"

      - name: Install update verifier dependencies
        run: |
          python -m pip install --upgrade \
            -c deploy/requirements/runtime.constraints.txt \
            -r deploy/requirements/runtime.txt

      - name: Verify live stable update manifest
        env:
          RAW_RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RAW_BUNDLE_SHA256: ${{ needs.build-update-bundle-and-release.outputs.bundle_sha256 }}
          EXPECTED_CATALOG_SHA256: ${{ needs.build-update-bundle-and-release.outputs.catalog_sha256 }}
          RAW_IMAGE_REQUIRED: ${{ steps.release.outputs.image_required }}
          RAW_DELIVERY_MODE: ${{ steps.release.outputs.delivery_mode }}
          RAW_RECOMMENDED_IMAGE_VERSION: ${{ steps.release.outputs.recommended_image_version }}
        run: |
          python scripts/release/verify-live-update-manifest.py \
            --version "${RAW_RELEASE_VERSION}" \
            --release-url "https://github.com/CoderLuii/ChannelWatch/releases/tag/${RELEASE_TAG}" \
            --bundle-sha256 "${RAW_BUNDLE_SHA256}" \
            --catalog-sha256 "${EXPECTED_CATALOG_SHA256}" \
            --image-required "${RAW_IMAGE_REQUIRED}" \
            --delivery-mode "${RAW_DELIVERY_MODE}" \
            --recommended-image-version "${RAW_RECOMMENDED_IMAGE_VERSION}" \
            --catalog-url "https://channelwatch.coderluii.dev/updates/v2/stable.json" \
            --attempts "90" \
            --interval "10"

      - name: Verify live runtime update catalog
        if: steps.release.outputs.updater_protocol == '4'
        env:
          EXPECTED_RUNTIME_CATALOG_SHA256: ${{ needs.build-update-bundle-and-release.outputs.runtime_catalog_sha256 }}
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          live_dir="${RUNNER_TEMP}/live-runtime-catalog"
          mkdir -p "${live_dir}"
          download() {
            url="$1"
            output="$2"
            curl --fail --silent --show-error --location \
              --proto '=https' --tlsv1.2 \
              --connect-timeout 20 --max-time 180 \
              --retry 12 --retry-all-errors --retry-delay 5 --retry-max-time 360 \
              --output "${output}" "${url}"
            test -s "${output}"
          }
          runtime_catalog="${live_dir}/channelwatch-update-catalog-v3.json"
          bundle="${live_dir}/channelwatch-app-${RELEASE_TAG}.zip"
          manifest="${live_dir}/channelwatch-update-${RELEASE_TAG}.json"
          catalog="${live_dir}/channelwatch-catalog-${RELEASE_TAG}.json"
          download "https://channelwatch.coderluii.dev/updates/v3/stable.json" "${runtime_catalog}"
          if [ "$(sha256sum "${runtime_catalog}" | awk '{print $1}')" != "${EXPECTED_RUNTIME_CATALOG_SHA256}" ]; then
            echo "::error::Live schema-3 catalog does not match the approved release asset."
            exit 1
          fi
          release_base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}"
          download "${release_base}/$(basename "${bundle}")" "${bundle}"
          download "${release_base}/$(basename "${manifest}")" "${manifest}"
          download "${release_base}/$(basename "${catalog}")" "${catalog}"

          runtime_verify_args=(
            --runtime-catalog "${runtime_catalog}"
            --expected-runtime-source-commit "${RELEASE_SHA}"
          )
          if [ "$(jq -r '.runtime_generation_required // false' scripts/release/release-config.json)" = "true" ]; then
            for architecture in amd64 arm64; do
              runtime_bundle="${live_dir}/channelwatch-runtime-${RELEASE_TAG}-${architecture}.zip"
              runtime_url="${release_base}/$(basename "${runtime_bundle}")"
              download "${runtime_url}" "${runtime_bundle}"
              runtime_verify_args+=(
                --runtime-bundle "${architecture}=${runtime_bundle}"
                --expected-runtime-bundle-url "${architecture}=${runtime_url}"
              )
            done
          fi
          python scripts/release/verify-update-assets.py \
            --release-config scripts/release/release-config.json \
            --manifest "${manifest}" \
            --catalog "${catalog}" \
            --bundle "${bundle}" \
            --expected-version "${VERSION}" \
            --expected-channel stable \
            --expected-runtime-abi channelwatch-runtime-v1 \
            --expected-settings-schema-version 7 \
            --expected-image-required "${{ steps.release.outputs.image_required }}" \
            --expected-delivery-mode "${{ steps.release.outputs.delivery_mode }}" \
            --expected-recommended-image-version "${{ steps.release.outputs.recommended_image_version }}" \
            --expected-git-sha "${RELEASE_SHA}" \
            --expected-release-url "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}" \
            --expected-bundle-url "${release_base}/$(basename "${bundle}")" \
            "${runtime_verify_args[@]}" \
            --source-root "${GITHUB_WORKSPACE}"

      - name: Verify pinned public v1 bridge
        run: |
          python scripts/release/verify-pinned-v1-bridge.py

  advance-compatible-aliases:
    name: Advance verified latest images
    runs-on: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.actor == 'CoderLuii' && vars.CHANNELWATCH_RELEASE_RUNNER || 'ubuntu-latest' }}
    needs:
      - build-and-push
      - verify-live-update-manifest
    permissions:
      contents: read
      packages: write # Advance the verified GHCR latest image.

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/docker-auth/.docker
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/docker-auth/.docker
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Advance aliases only after public update canaries
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/docker-auth/.docker
        shell: bash
        run: |
          set -euo pipefail

          skopeo_cmd() {
            docker run --rm \
              --volume "${DOCKER_CONFIG}:/auth:ro" \
              "${SKOPEO_IMAGE}" "$@"
          }

          version="${RELEASE_TAG#v}"
          for repository in "${DOCKERHUB_IMAGE}" "${GHCR_IMAGE}"; do
            version_digest="$(skopeo_cmd inspect \
              --authfile /auth/config.json \
              --format '{{.Digest}}' \
              "docker://${repository}:${version}")"
            for alias_tag in latest; do
              skopeo_cmd copy \
                --all \
                --preserve-digests \
                --authfile /auth/config.json \
                "docker://${repository}@${version_digest}" \
                "docker://${repository}:${alias_tag}"
              alias_digest="$(skopeo_cmd inspect \
                --authfile /auth/config.json \
                --format '{{.Digest}}' \
                "docker://${repository}:${alias_tag}")"
              if [ "${alias_digest}" != "${version_digest}" ]; then
                echo "::error::${repository}:${alias_tag} does not reference the verified version manifest."
                exit 1
              fi
            done
          done
