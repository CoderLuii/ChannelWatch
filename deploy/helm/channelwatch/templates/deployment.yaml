apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "channelwatch.fullname" . }}
  labels:
    {{- include "channelwatch.labels" . | nindent 4 }}
spec:
  replicas: 1
  # ChannelWatch owns one persistent /config writer for the lifetime of the
  # container. A rolling Deployment can deadlock by starting the replacement
  # before terminating the pod that still owns that writer lock.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "channelwatch.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "channelwatch.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        checksum/channelwatch-config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if and
              (not (.Values.secretConfig.existingSecret | trim))
              (eq (include "channelwatch.hasSecretConfig" .) "true") }}
        checksum/channelwatch-managed-secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: channelwatch
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "channelwatch.configMapName" . }}
            {{- if eq (include "channelwatch.hasSecretConfig" .) "true" }}
            - secretRef:
                name: {{ include "channelwatch.secretName" . }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8501
              protocol: TCP
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          startupProbe:
            httpGet:
              path: {{ .Values.probes.startup.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.startup.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          volumeMounts:
            - name: config
              mountPath: /config
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: {{ include "channelwatch.pvcName" . }}
        - name: tmp
          emptyDir: {}
