{{- if ne (int .Values.replicaCount) 1 -}}
{{- fail "ChannelWatch supports replicaCount=1 only. Multi-replica is unsupported because /config is shared state and the application is not designed for concurrent writers." -}}
{{- end -}}
{{- if not .Values.persistence.enabled -}}
{{- fail "ChannelWatch requires persistence.enabled=true because /config must be backed by a PersistentVolumeClaim." -}}
{{- end -}}
{{- range $name, $_ := .Values.podAnnotations -}}
  {{- if hasPrefix "checksum/channelwatch-" $name -}}
    {{- fail "podAnnotations keys beginning with checksum/channelwatch- are reserved for chart-managed rollout checksums." -}}
  {{- end -}}
{{- end -}}
{{- $existingSecret := .Values.secretConfig.existingSecret | trim -}}
{{- $secretStorageKey := .Values.secretConfig.secretStorageKey | trim -}}
{{- $managedSecretValues := list
      $secretStorageKey
      (.Values.secretConfig.apiKey | trim)
      (.Values.secretConfig.adminUser | trim)
      (.Values.secretConfig.adminPass | trim)
      (.Values.secretConfig.appriseDiscord | trim)
      (.Values.secretConfig.apprisePushover | trim)
      (.Values.secretConfig.appriseTelegram | trim)
      (.Values.secretConfig.appriseEmail | trim)
      (.Values.secretConfig.appriseEmailTo | trim)
      (.Values.secretConfig.appriseSlack | trim)
      (.Values.secretConfig.appriseGotify | trim)
      (.Values.secretConfig.appriseMatrix | trim)
      (.Values.secretConfig.appriseCustom | trim) -}}
{{- if $existingSecret -}}
  {{- range $managedSecretValues -}}
    {{- if . -}}
      {{- fail "secretConfig.existingSecret cannot be combined with chart-managed secretConfig values. Put optional ChannelWatch credentials and any deprecated migration-only CHANNELWATCH_SECRET_STORAGE_KEY in the existing Secret." -}}
    {{- end -}}
  {{- end -}}
{{- else if and $secretStorageKey (lt (len $secretStorageKey) 32) -}}
{{- fail "deprecated secretConfig.secretStorageKey must contain at least 32 non-whitespace characters when supplied for a one-time legacy envelope migration." -}}
{{- end -}}
