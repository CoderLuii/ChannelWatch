# Multi-replica is intentionally unsupported for ChannelWatch.
replicaCount: 1

image:
  repository: coderluii/channelwatch
  tag: "1.0.6"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 8501
  # Preserve UI/setup access while monitoring readiness is degraded. This chart
  # supports one replica only, so readiness remains a status signal rather than
  # a traffic-shifting mechanism.
  publishNotReadyAddresses: true

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: channelwatch.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  # Example tls entry:
  # - secretName: channelwatch-tls
  #   hosts:
  #     - channelwatch.local

persistence:
  enabled: true
  existingClaim: ""
  accessModes:
    - ReadWriteOnce
  size: 10Gi
  storageClassName: ""
  annotations: {}

resources: {}

# Keys beginning with checksum/channelwatch- are reserved by the chart.
podAnnotations: {}
podLabels: {}

# The chart adds checksums for its ConfigMap and any chart-managed Secret so
# those changes recreate the single ChannelWatch pod. Kubernetes cannot hash
# the contents of secretConfig.existingSecret during Helm rendering; after
# changing that same external Secret, restart the Deployment selected by the
# release's app.kubernetes.io/instance label in the release namespace.

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  capabilities:
    drop:
      - ALL

podSecurityContext:
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

config:
  tz: America/New_York
  channelsDvrHost: ""
  channelsDvrPort: "8089"
  channelsDvrServers: ""
  puid: "1000"
  pgid: "1000"
  logLevel: "1"
  disableAuth: "false"
  # Comma-separated exact proxy IPs/CIDRs allowed to supply forwarded headers.
  trustedProxies: ""
  alertChannelWatching: "true"
  alertVodWatching: "true"
  alertDiskSpace: "true"
  alertRecordingEvents: "true"
  dsThresholdPercent: "10"
  dsThresholdGb: "50"
  dsAlertCooldown: "3600"

secretConfig:
  # Use either an existing Secret or the chart-managed values below, not both.
  # CHANNELWATCH_SECRET_STORAGE_KEY is no longer required. ChannelWatch creates
  # and manages its encryption key under the persistent /config volume.
  existingSecret: ""
  # Deprecated migration-only input for an envelope created by v0.9.5-v0.9.17.
  # Keep the old value for one successful migration restart, then remove it.
  secretStorageKey: ""
  apiKey: ""
  adminUser: ""
  adminPass: ""
  appriseDiscord: ""
  apprisePushover: ""
  appriseTelegram: ""
  appriseEmail: ""
  appriseEmailTo: ""
  appriseSlack: ""
  appriseGotify: ""
  appriseMatrix: ""
  appriseCustom: ""

probes:
  startup:
    path: /healthz/startup
    initialDelaySeconds: 0
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 30
  readiness:
    path: /healthz/ready
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  liveness:
    path: /healthz/live
    initialDelaySeconds: 0
    periodSeconds: 30
    timeoutSeconds: 3
    failureThreshold: 3
